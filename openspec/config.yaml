# openspec/config.yaml
schema: spec-driven

project: constanza-android

context: |
  Constanza: native Android habit tracker (tracking + reminders only,
  no to-do list, no gamification). Repository is greenfield: no source
  code, no Gradle files, no build system exist yet as of this init.
  Reference apps (Loop Habit Tracker/uhabits GPL-3.0, HabitNow, Habitify,
  Streaks) are reference-only; no code may be copied or derived from them.

carried_forward_open_items:
  note: >
    Genuinely open work items surfaced by a change but deliberately left out of
    its scope. None of these is a stale checkbox or an oversight; each is a
    documented, reasoned block with a named owner condition. This section is the
    durable home for them because a change folder eventually moves under
    archive/, which a future contributor opening a new change is unlikely to
    browse. Do not close any item silently in a future change — resolve it
    explicitly and remove it from this list when done, or replace it with a new
    decision. Item 7.5 was closed this way by warm-dark-design-system, which
    wrote the app's first Room migration and so met its owner condition.
  items:
    - id: "post-notifications-never-requested"
      title: "The app never requests POST_NOTIFICATIONS, so reminders are inert on a fresh API 33+ install"
      status: resolved
      severity: "highest of the open items — it silently disables the app's core feature"
      origin: >
        Found on 2026-09-02 by installing the debug build on the maintainer's own
        Galaxy S25 (SM-S931B, API 36) to try the app. Measured on the device
        immediately after a clean install: `POST_NOTIFICATIONS: granted=false`
        and `AppSettings: com.jjrapps.constanza importance=NONE`. The maintainer
        independently confirmed the behaviour from the other side: the only
        permission prompt they ever saw was the exact-alarm deep link to a system
        settings screen, never the native notification prompt.
      reason: >
        Nothing in the app asks. Verified across all of app/src/main: there is no
        `rememberLauncherForActivityResult(RequestPermission())` anywhere, and no
        Intent to ACTION_APP_NOTIFICATION_SETTINGS either. The only permission
        launchers in the codebase are the SAF document pickers in
        DataPortabilityScreen.kt. So canPost() returns false, NotificationPoster
        correctly declines to post, and no reminder ever arrives — with no
        in-app path out of the denied state.
      not_a_spec_violation: >
        Be precise about this. reminder-response's `Notification Permission
        Scope` requires that delivery be GATED by the permission on API 33+,
        that API 31-32 deliver with no prompt, and that a denial still leave the
        today screen usable for in-app answering. All three are implemented and
        its scenario passes. The spec never required the app to ASK. This is a
        product gap whose promise lives in the code's own KDoc, the same shape as
        the Theme.kt product-palette promise.
      why_it_matters: >
        Eleventh instance of this repository's defining failure mode. The logic
        is already written and unit-tested: NotificationPermission.kt is a
        four-state decision table whose SHOULD_REQUEST state is documented as
        "the contextual moment to request", and
        ReminderSettingsStore.recordRequestedNotificationPermission() exists for
        the same caller. BOTH have zero production consumers — the only
        reference to SHOULD_REQUEST outside its file is its own test. The class
        KDoc names the owner: "the future onboarding/settings UI, work unit
        6a/6b". Units 6a and 6b both shipped without it.
      owner_condition: >
        No blocker. A Today banner symmetric to the existing ExactAlarmBanner,
        which is already the right pattern in this codebase: consult
        NotificationPermission.decide(hasRequestedBefore); on SHOULD_REQUEST
        launch the native POST_NOTIFICATIONS prompt and call
        recordRequestedNotificationPermission() on return; on BLOCKED offer a
        deep link to ACTION_APP_NOTIFICATION_SETTINGS, the same gesture the
        exact-alarm banner uses; on GRANTED or NOT_APPLICABLE render nothing.
      resolution: >
        Shipped exactly as the owner condition describes, on branch
        fix/request-post-notifications. TodayViewModel now injects
        NotificationPermission and ReminderSettingsStore and folds
        NotificationPermission.decide(hasRequestedNotificationPermission()) into
        TodayUiState, re-reading it on ON_RESUME alongside the existing
        exact-alarm re-check. TodayScreen renders a NotificationPermissionBanner
        above the exact-alarm banner (a missing permission outranks a late one)
        for SHOULD_REQUEST and BLOCKED only. SHOULD_REQUEST launches the native
        prompt through rememberLauncherForActivityResult(RequestPermission())
        and calls recordRequestedNotificationPermission() when the dialog
        returns, whatever the user answered — the flag means "we have asked".
        BLOCKED deep-links to ACTION_APP_NOTIFICATION_SETTINGS with
        EXTRA_APP_PACKAGE. GRANTED and NOT_APPLICABLE render nothing.
        NotificationPermission and recordRequestedNotificationPermission() now
        have their first production consumers.
      resolution_caveat: >
        NOT confirmed on real hardware. No device is attached, so the verified
        evidence is JVM-level only: :app:compileDebugKotlin,
        :app:testDebugUnitTest (121 tests, 0 failures, including three new
        TodayViewModelTest cases covering the decision reaching TodayUiState,
        the ON_RESUME re-read, and the record-then-refresh transition from
        SHOULD_REQUEST to BLOCKED), :app:detekt, :app:detektMain and
        :app:lintDebug all pass. What is still unproven is the part that
        originally failed on the device: that the native prompt actually appears
        on a clean install on the Galaxy S25 (API 36) and that granting it
        flips the channel out of importance=NONE. Re-run the original
        measurement — clean install, launch, screenshot, then
        `adb shell dumpsys package com.jjrapps.constanza | rg POST_NOTIFICATIONS`
        and `adb shell dumpsys notification_manager | rg -A3 com.jjrapps.constanza`
        — before treating this as closed on device.
    - id: "habit-editor-has-no-cancel-affordance"
      title: "The habit editor cannot be backed out of; cancelling closes the app"
      status: resolved
      origin: >
        Found on 2026-09-02 while settling first-run-onboarding's finish
        destination, and reported independently by the maintainer, who hit it
        on their own phone while creating a habit.
      reason: >
        `HabitEditorTopBar` was `TopAppBar(title = { Text(...) })` with no
        navigation icon; `onDone` fired only from `viewModel.events`, which
        emits after a successful save; and `BackHandler` appeared nowhere in
        app/src/main, so system back fell through to the Activity default and
        finished it. There was no way to leave the editor without saving except
        closing the app.
      why_it_matters: >
        Tolerable while every route into the editor was one the user chose from
        the habit list. It stopped being tolerable the moment anything else
        landed them there.
      resolution: >
        Closed across two changes rather than one, which is why this item
        outlived the first of them.

        PR #47 gave the editor its own exit: a navigation icon
        (`HabitEditorScreen.kt:281-284`), an `onBack` parameter on the Route
        (`:88`), the codebase's first `BackHandler` (`:116`, disabled while the
        discard dialog is up so the two never stack), and a confirm-before-
        discard dialog gated on derived dirty state — leaving is immediate when
        nothing was touched.

        PR #57 supplied the second entry point this item predicted, adding an
        add-habit action to Today, and `ConstanzaRoute.EditorOrigin` now gives
        every route in a defined exit: HabitList returns to the list,
        Onboarding and Today both return to Today
        (`MainActivity.kt:140-142`).
      resolution_note: >
        The owner_condition asked for a real decision rather than just a back
        arrow, on whether an editor with unsaved edits should confirm before
        discarding. It does, and the dirty state behind it is derived by
        comparing the whole form against its pristine baseline rather than by
        setting a flag per field — so a field added later participates the
        moment it is declared, instead of being silently missed.
      verified: >
        Re-checked in source on 2026-09-03, after both changes merged: all five
        of this item's stated gaps are closed, and all three EditorOrigin
        branches resolve to a destination. The item's own text was stale rather
        than open.

        Confirmed on hardware the same day. The maintainer installed the release
        build on their Galaxy S25 and reported back that the screen can now be
        left — the same person who found the defect, on the same device, closing
        it by use rather than by reading the diff.
    - id: "today-has-no-add-habit-affordance"
      title: "Today offers no way to add a habit, and reads as broken when it is empty"
      status: resolved
      origin: >
        Raised by the maintainer on 2026-09-02 while designing onboarding. A
        first-run user finishing onboarding lands on Today with zero habits,
        which is the state the screen handles worst.
      reason: >
        TodayScreen renders only `R.string.today_empty` as a bare Text when
        `state.rows.isEmpty()`, and the sole route to habit creation is the
        "Manage habits" TextButton in the TopAppBar actions, which reads as
        navigation rather than as the primary action. There is no add
        affordance on Today itself in either the empty or the populated state.
      why_it_matters: >
        This is the first screen of the app and, on a clean install, it is
        empty by definition. An empty list with no call to action is
        indistinguishable from a broken screen. It also leaves the onboarding
        flow unfinished: the flow ends by handing the user a screen that does
        not tell them what to do next.
      owner_condition: >
        Its own change, sequenced after onboarding since onboarding is what
        makes the empty state the guaranteed first thing a new user sees. Two
        distinct presentations were requested: a centred "Add habit" action
        when there are no habits, and the same action at the end of the list
        once habits exist. Worth deciding at that point whether the populated
        case is better served by a FAB than by a trailing list item, and
        whether Today's empty state should instead route straight into the
        habit editor.
      resolution: >
        Shipped as the maintainer asked, in both presentations and with one
        shared `today_add_habit` label, because it is one action rather than
        two. Empty: a centred filled Button under the existing
        `today_empty` sentence — the sentence says what the state is, the
        button says what to do about it. Populated: the same filled Button,
        centred, in a trailing `LazyColumn` item after the last habit row.
        Both live in the new `tracking/TodayAddHabitAction.kt`, kept out of
        `TodayScreen.kt` for the reason `TodayBanners.kt` already exists.

        NOT a FloatingActionButton for the populated case, and the
        owner_condition's open question above is answered rather than dodged:
        `HabitListScreen` already has a FAB for creating a habit and is one
        tap away behind "Manage habits", so a second, differently shaped
        create affordance would leave the two screens disagreeing about what
        creating a habit looks like. A centred filled pill cannot be read as a
        habit row either — every row here starts with a colour dot at the
        leading edge — which was the risk a trailing list item carried.

        Routing: `ConstanzaRoute.EditorOrigin` gained a third member, `Today`,
        mapping to `leaveTo = Today`. Deliberately not reusing `Onboarding`,
        whose exit is identical today: they are different journeys, and the
        `HabitList` origin would have stranded the user, since `HabitListRoute`
        takes no `onBack`.

        The empty state does NOT sit in the `LazyColumn`. A `fillParentMaxSize`
        item is measured against the whole viewport and knows nothing about the
        permission banners above it, and on the emulator, with both banners
        showing, the "centred" action landed in the bottom third of the screen.
        `TodayContent` now renders a plain `Column` when there are no rows, with
        the empty state taking `weight(1f)` of what is actually left. The
        populated path keeps the `LazyColumn` and its scrolling unchanged. The
        two banners moved behind one `TodayPermissionBanners` composable so both
        layouts place the pair identically.
      verified: >
        `:app:testDebugUnitTest`, `:app:detekt`, `:app:detektMain` and
        `:app:lintDebug` green. `:app:emulatorMatrixGroupDebugAndroidTest`
        green on both legs, 91 tests each (api31 0 failures, api37 0 failures)
        — five of those tests are new: `TodayAddHabitComposeTest` (empty shows
        the centred action and not the trailing one, and vice versa; the
        trailing action's bounds sit below both the habit name and its answer
        buttons, so it cannot be occupying a row's place) and
        `TodayAddHabitE2ETest`, which drives the real `MainActivity` because
        only that has the hoisted route: tap the centred action, reach the
        editor, back out to Today rather than the habit list, then save from it
        and land on Today with the action now trailing.

        Installed on the API 37 emulator and both states screenshotted and
        read. Empty: the sentence and the pill are centred in the space under
        the two permission banners, not stranded at the top and not pushed
        below the fold. Populated (with the reported 65-character habit name):
        the pill sits clearly below the row, centred, with no leading dot — it
        reads as an action, not a stray row.
      not_verified: >
        Nothing on the physical Galaxy S25 — emulator only. The empty state's
        `weight(1f)` column has no scroll of its own, so on a screen short
        enough for two banners plus the call to action to exceed it the action
        would be clipped rather than scrolled to; not reachable on any device
        in the matrix and not tested for.
    - id: "compose-test-db-teardown-race"
      title: "TodayComposeTest's async DB teardown can crash the whole instrumentation process"
      status: resolved
      severity: "does not fail the build honestly — it misattributes failures to unrelated tests"
      origin: >
        Fired on 2026-09-02 during first-run-onboarding Unit B's second matrix
        run: the entire api31 instrumentation process died inside
        TodayComposeTest/TodayAdaptiveComposeTest while CoreFlowE2ETest had
        already passed 5/5. A third run with no code changes was clean. The
        failure mode is not new — TodayComposeTest.kt:70-77's own KDoc already
        describes it.
      reason: >
        The test builds a real Room database and constructs TodayViewModel by
        bare constructor. Its @After must cancel viewModelScope BEFORE closing
        the database, or an eager `stateIn` collector throws asynchronously
        after teardown. When it does, the throw lands in the shared
        instrumentation process rather than in the test that caused it.
      why_it_matters: >
        The device-free matrix is now the binding verification gate for this
        project. A gate that intermittently reports a failure against a test
        that did not cause it is worse than a gate that fails: it sends the
        next reader to debug the wrong file. This did not affect the change
        that found it, but it will eventually cost somebody an afternoon.
      owner_condition: >
        Its own small change. The fix is structural rather than a longer
        timeout: make teardown deterministic so the collector cannot outlive
        the database. Worth auditing every instrumented test that constructs a
        ViewModel by bare constructor, not just these two.
      resolution: >
        Fixed on branch fix/compose-teardown-race by moving the ordering out of
        the tests and into the object that owns the database.

        HabitRepositoryTestFixture now owns ViewModel lifetime. Every ViewModel
        reaches it through a factory — fixture.todayViewModel(),
        habitListViewModel(), habitEditorViewModel(), or register() for one with
        no factory yet — and close() drains every registered scope in reverse
        creation order before database.close(). No test writes a teardown
        ordering any more; the six that had hand-copied one now just call
        fixture.close().

        cancelAndJoin, not cancel. The KDoc the old tests copied described
        cancel(), which returns as soon as the job is marked cancelled and
        before its children have stopped — so a query already handed to Room's
        query executor could still land on a closing database. That was a
        smaller race, not the absence of one. Joining waits for it. The join is
        bounded by SCOPE_DRAIN_TIMEOUT_MS = 5s so a coroutine that refuses to
        finish degrades to the old behaviour rather than hanging the matrix
        behind one @After, and the timeout is deliberately not asserted on:
        throwing in @After would misattribute a result, which is the failure
        mode this whole change removes.

        The audit found more than the two classes this item named. Twelve
        androidTest classes built a ViewModel by bare constructor over a real
        Room database, at 15 call sites. Six already cancelled (TodayComposeTest,
        TodayAdaptiveComposeTest, TodayAddHabitComposeTest,
        TodaySlotRowComposeTest, EntryWriteParityTest, and HabitColorDotComposeTest
        partially). Seven were leaking: HabitEditorComposeTest,
        HabitEditorCancelComposeTest, HabitEditorRotationComposeTest,
        HabitEditorTimePickerComposeTest, HabitScheduleKindComposeTest,
        HabitListArchiveComposeTest, and HabitColorDotComposeTest's second
        ViewModel — its HabitListViewModel, which has an eager stateIn over
        habitRepository.observeAll() and was never cancelled at all, while the
        same class carefully cancelled its TodayViewModel. The e2e classes were
        checked and need no change: they construct no ViewModels themselves, and
        CoreFlowTestFixture opens its own Room.databaseBuilder handle rather than
        Hilt's singleton, so its close() never shuts the database the Activity's
        ViewModels read.

        The six identical TodayViewModel(...) constructions collapsed into one
        factory. Net across the change: 148 insertions against 207 deletions.

        Enforced rather than documented, because a correct fix written once in a
        KDoc and applied to three of ten files is what created this item.
        ViewModelTeardownCallSiteTest (app/src/test) scans src/androidTest/kotlin
        as text and fails the build on a bare constructor of any of the app's
        eight ViewModels — not only the three built today, since six of the eight
        carry an eager collector. It exempts a construction passed directly to
        register(), blanks comments and strings first, and pins both judgements
        against inline sources. It also asserts its own reach, so a scan that
        reads nothing cannot pass.

        detekt was considered and does not reach this. app/build.gradle.kts
        registers exactly one type-resolved detekt task, detektMain, with
        setSource(files("src/main/kotlin")); the plugin's plain detekt task is
        PSI-only under AGP 9. A ForbiddenMethodCall ban on these constructors
        would therefore not resolve in androidTest at all. Covering it would mean
        a third type-resolved task wired to debugAndroidTestCompileClasspath.
        That is the alternative; the call-site test is the lighter guard and
        reuses the precedent ControlStrokeCallSiteTest already set.
      resolution_verification: >
        Baseline first: the matrix was run on the unmodified tree at ef9d372
        before anything changed, and it was GREEN — 182 testcases across both
        legs, 179 passed, 3 skipped, 0 failed, 0 errored. So main was not red
        when this was fixed. That is the expected shape of a race, not evidence
        against one: the same defect had already been observed failing twice,
        once as a ComposeTimeoutException on api37 and once as an
        SQLException from ReminderSlotDao.findByHabitId that poisoned the
        following test through UncaughtExceptionsBeforeTest.

        After the fix: :app:testDebugUnitTest 160/160 green, and
        :app:detekt :app:detektMain :app:lintDebug clean. The matrix was then run
        twice with --rerun-tasks, both times on exactly the committed code, and
        both were green — 182 testcases, 179 passed, 3 skipped, 0 failed, 0
        errored, each time.
        `TodayComposeTest.skippingInAppPersistsSkippedOnTheAnsweredSlotAndDate`,
        the api37 test a control run had caught failing, passed on api37 in both
        (1.17s and 1.62s).

        All result XML was parsed with xml.etree.ElementTree rather than a
        regex, since a self-closing <testcase/> makes a naive regex blame the
        wrong test — the same misattribution this item is about. That mattered
        in practice: Gradle's console counter reported "api31 Tests 92/91
        completed" on the second run, while the XML for that leg held exactly 91
        testcases with no duplicates. The log line was the artefact; the parsed
        result was not.

        The teardown drain costs nothing measurable. api31's suite time was
        172.02s before the change and 169.52s / 171.35s across the two runs
        after it, so the bounded cancelAndJoin is completing promptly rather
        than sitting on its 5s timeout.

        The guard was proved to bite rather than assumed to: planting
        HabitListViewModel(fixture.habitRepository) back into
        HabitListArchiveComposeTest failed testDebugUnitTest with the offending
        file and line named, and reverting it went green again.
      resolution_caveat: >
        A race can never be proven absent. Two clean matrix runs raise
        confidence and prove no regression; they do not establish that the
        window is closed, and the pre-fix baseline in this very item was itself
        green — which is the point. Three green runs in a row, one of them on
        the unfixed code, is exactly what an intermittent defect looks like from
        close up, so the run count is the weakest part of this evidence. What is stronger than the run count is the argument: teardown now
        joins the cancelled scopes instead of merely signalling them, so the
        collector cannot still be running when close() returns unless the 5s
        drain bound is hit — and the enforcement test means a future test cannot
        quietly reintroduce the old shape. If this ever fires again, suspect the
        drain timing out silently first; that is the one path left where close()
        proceeds with work still in flight.
    - id: "no-in-app-route-to-edit-a-past-day"
      title: "Provisional-Missed Correction mandates an in-app past-day edit, and no screen can reach one"
      status: open
      origin: >
        Found on 2026-09-03 while spec'ing today-answered-slot-collapse, when
        the spec phase had to reason about whether that requirement needed a
        delta. It does not — but checking why exposed this.
      reason: >
        habit-entry-tracking's `Provisional-Missed Correction` names three
        paths that must be able to answer an already-resolved occurrence: from
        a notification, from an import, and "a manual in-app edit of a past
        day". The first two exist. The third has no surface.

        `TodayViewModel` pins `private val today = timeProvider.today()` with
        no date parameter, and the app's five routes — Today, HabitList,
        HabitEditor(habitId), Progress(habitId), Settings — take no date
        between them. `EntryWriter.writeEntry` accepts an arbitrary
        `LocalDate`, and `EntryWriter.answerInApp` credits the originally
        scheduled date correctly, so the write path is complete and correct.
        Nothing can call it with a past date.
      why_it_matters: >
        The sixteenth instance of this repository's defining failure mode, and
        the same shape as the eleventh: capability written, tested at the layer
        below, and never given a caller. It is worse than a missing feature
        because the spec asserts the route exists — a reader checking
        compliance against the requirement would tick it.

        Practically: a reminder missed while the phone was off resolves to
        MISSED overnight, and the user has no way to correct it. The
        notification is gone and Today only ever shows today.
      owner_condition: >
        Its own change, and it needs a product decision before a technical
        one: whether Today gains date navigation, whether Progress becomes the
        surface for it, or whether the requirement is narrowed to the two
        routes that exist. Narrowing is a legitimate answer — but it has to be
        an argued decision, not the silence it is today.
    - id: "today-row-answering-is-cramped-and-always-on"
      title: "Today's answer buttons never fit, and never go away once answered"
      status: resolved
      severity: "this is the screen the app exists for, used every day"
      origin: >
        Reported by the maintainer on 2026-09-02 from a screenshot of their own
        Galaxy S25 with two real habits on it. "Skip" was wrapping onto two
        lines as "Ski / p".
      reason: >
        Three separate defects stack on the same row, and only the first is
        visible at a glance.

        1. LAYOUT. TodayScreen.kt's `SlotRow` lays its status text and its
        button group in a `Row` with `Arrangement.SpaceBetween` and NO
        `weight(1f)` on the text. The text takes whatever width it wants and
        the buttons are squeezed into what is left, so "Skip" wraps. This is
        the exact failure `ExactAlarmBanner` carries a load-bearing comment
        about, three functions away in the same file — the fix was learned
        once and not applied here.

        2. RAW ENUM IN THE UI. `slotStatusText`'s fallback is
        `slot.status.name`, so the screen renders the Kotlin constant
        "COMPLETED" rather than a localised string. Every other piece of copy
        in the app comes from strings.xml.

        3. INTERACTION. All three actions render for every slot at all times,
        including slots that are already answered. In the reported screenshot
        both habits read COMPLETED and both still offer Yes / No / Skip with
        equal weight. Once a slot is answered the need is to see that it is
        done and to be able to correct it — not to be re-asked.
      why_it_matters: >
        Today is the screen the product exists for and the one a user opens
        every day. It is also where onboarding now lands them. Three equal
        buttons per row means the screen never communicates progress at a
        glance: a finished day and an untouched day look almost identical.
      maintainer_proposal: >
        Do not show the answer buttons by default; reveal them on swipe or by
        some other gesture.
      analysis_to_do: >
        Worth designing rather than patching, and the options trade off
        differently:

        - Swipe to answer (the maintainer's suggestion). Fast once learned,
          but invisible: nothing on screen says the gesture exists. Risky as
          the ONLY route to the primary daily action; needs an affordance or a
          first-run hint.
        - Tap the row to expand its actions inline. Discoverable, costs one
          extra tap on the common path.
        - Single tap cycles the state, long-press for the rest. What Loop
          does. Fastest for the overwhelming majority case (Yes) and hides the
          other two behind a deliberate gesture.
        - Keep the buttons but make them compact icon buttons. Smallest
          possible change, fixes the wrapping, changes no interaction — a
          reasonable interim if the redesign is deferred.
        - Collapse an ANSWERED slot to a state chip with an undo affordance,
          and show actions only on unanswered ones. This is orthogonal to the
          others and probably the highest-value part: it is what makes the
          screen readable at a glance.

        The last one plus any of the first four is likely the answer. Whatever
        is chosen must keep every action reachable without a gesture for
        accessibility — a swipe-only control is unusable with TalkBack.
      owner_condition: >
        Its own change, and probably SDD: it modifies `habit-entry-tracking`'s
        published "Day-Level Rollup and Per-Slot Display" and "Slot
        Independence" requirements, and `TodayAdaptiveComposeTest` asserts row
        heights at sw>=600dp. Defects 1 and 2 are small enough to fix
        immediately and independently if the redesign is deferred; do not let
        them wait on it.
      partial_resolution: >
        Defects 1 and 2 are fixed and shipped on the `today-add-habit` branch,
        at the maintainer's explicit request, taking the owner_condition's own
        offer to fix them without waiting for the redesign. Defect 3 is
        untouched and this item STAYS OPEN for it.

        1. LAYOUT. `SlotRow`'s status `Text` now carries
        `Modifier.weight(1f).padding(end = Spacing.sm)` and the row aligns its
        children `CenterVertically` — the same fix `ExactAlarmBanner` and
        `NotificationPermissionBanner` already carry in `TodayBanners.kt`. The
        buttons keep their intrinsic width and the status text wraps instead,
        which is the right way round: a wrapped sentence is readable, a wrapped
        control label is not. The single-slot row's name `Row` also gained
        `end = Spacing.lg` padding, since a full-sentence habit name otherwise
        ran to the bezel.

        2. RAW ENUM. `slotStatusText`'s `else -> slot.status.name` is gone.
        `slotStatusLabel(EntryStatus)` mirrors the `dayStatusLabel(DayStatus)`
        already in that file and is exhaustive with no `else`, so adding an
        `EntryStatus` member breaks the compile rather than silently reaching a
        default. Three new strings — `today_slot_completed` ("Done"),
        `today_slot_missed` ("Missed"), `today_slot_skipped` ("Skipped");
        `UNKNOWN` keeps the `today_slot_pending` it already had. Shorter than
        their day-level counterparts on purpose: the slot line already carries
        its time and shares one row with three buttons.
      partial_resolution_verified: >
        `TodaySlotRowComposeTest` is new and pins both halves at a 360dp window
        — pinned rather than inherited, since a width defect proven only at the
        connected device's width proves nothing. It seeds the reported habit
        name verbatim ("Hacer ejercicios de movilidad en la primera hora tras
        despertarme") and asserts "Skip"'s bounds are no taller than "Yes"'s,
        which is what a wrapped label breaks, plus that the group stays inside
        the screen. `TodayComposeTest`'s two status assertions were updated
        from `EntryStatus.<X>.name` to the string resources and now also assert
        the raw constant does NOT appear.

        Both confirmed on the API 37 emulator with that habit name on screen:
        the row reads "08:00 — Pending" with Yes / No / Skip all on one line,
        and after tapping Yes it reads "08:00 — Done", not "COMPLETED". The
        `uiautomator` dump backs the screenshot — all three labels 53px tall,
        right edge 998 of 1080.
      resolution: >
        Defect 3 closed by change `today-answered-slot-collapse` (PR #65, merged
        2026-09-03), which is the interaction redesign this item's analysis_to_do
        called for rather than a patch around it. An answered slot no longer
        re-offers Yes / No / Skip: it names its own answer — "Done", "Missed" or
        "Skipped", reusing the three strings defect 2 introduced — and offers
        exactly one control to change it, which reopens that slot alone.

        Three constraints were specified rather than left to the implementation,
        because each is a way the obvious version would have been wrong. The
        answered states are distinguished by text, never by colour or position
        alone. The change control is reachable by a standard tap or an
        accessibility-service action and never by a gesture, so a TalkBack user
        can reopen a row at all. And each control's accessible label names its
        own slot, so two answered slots on one habit do not both announce
        "Change".

        The published `habit-entry-tracking` requirements this touches were
        widened rather than added: Slot Independence now covers presentation and
        control set, not only the `Entry` row, and Day-Level Rollup now carries
        the answered-state display rules. Four scenarios added, every existing
        one preserved.
      resolution_verified: >
        `TodayAnsweredSlotComposeTest` covers the collapse, the three distinct
        labels, sibling independence (reopening one answered slot leaves a
        same-habit, same-date sibling collapsed), and the gesture-free
        reachability of each control. Full matrix green on the merged content:
        115 tests per leg on api31 and api37, 0 failures, 0 errors, with the
        skips complementary by design — api31 skips the two runtime
        `POST_NOTIFICATIONS` prompt tests that do not apply below API 33, api37
        skips the one asserting that below 33 the permission screen is omitted.

        One latent bug surfaced and was fixed with it: `slotStatusText` gained a
        `bypassSnooze` parameter. Without it an answered slot carrying a live
        snooze rendered "Pending, snoozed until 09:00" while holding a
        `COMPLETED` entry — status text contradicting the row's own state. The
        collapse made it visible; it was already wrong.

    - id: "no-launcher-icon"
      title: "The app ships with the stock Android launcher icon"
      status: resolved
      origin: >
        Seen on the S25 on 2026-09-02: the app appeared with the generic
        Android robot in the launcher and in system settings.
      reason: >
        AndroidManifest.xml declared
        `android:icon="@android:drawable/sym_def_app_icon"` and no mipmap
        resources existed anywhere in app/src/main/res.
      why_it_matters: >
        Not cosmetic once there is a design system. The warm-dark identity has
        a defined accent and palette, and the launcher icon is the one place a
        habit app is seen every day without being opened.
      resolution: >
        Adaptive icon shipped: drawable/ic_launcher_foreground.xml,
        drawable/ic_launcher_monochrome.xml, values/ic_launcher_background.xml
        and mipmap-anydpi/{ic_launcher,ic_launcher_round}.xml, with the manifest
        pointing at both icon and roundIcon. The mark is "Espiral" — one
        unbroken stroke coiling inward — chosen by the maintainer from five
        directions, in ACCENT_ARGB over BACKGROUND_ARGB.

        No raster anywhere and no density buckets: minSdk is 31, well above the
        26 that adaptive icons need, so legacy PNG fallbacks would be dead
        weight. The folder is `mipmap-anydpi`, not `-v26`; the version
        qualifier is redundant at this minSdk and lint's ObsoleteSdkInt was
        right to say so.
      resolution_lesson: >
        The first attempt shipped a broken drawing and it is worth recording
        why, because the failure was invisible in the source. The coil's radii
        stepped by 3 per half-turn, putting adjacent turns 6 apart, under a
        stroke of 9 that reaches 4.5 either side of its centreline — so
        consecutive turns overlapped by 3 and welded into a solid disc with a
        notch. It read as a coffee bean at every size, not just small ones.
        The rule the drawables now carry in comments: stroke must stay below
        the pitch. The corrected coil steps by 6.5 (pitch 13) under a stroke of
        8, leaving a clean 5-wide gap, and drops from two and a half turns to
        two, because a stroke that heavy cannot fit more inside the 66dp safe
        circle.

        The wider lesson is about verification, not geometry: the artwork was
        authored in SVG at large size and signed off there. Nothing catches
        this but rasterising it and looking.
      verified: >
        Built and installed on the API 37 emulator, app drawer screenshotted
        and read: the coil is legible as a spiral, centred, unclipped by the
        launcher mask. lint reports no icon findings — IconMissingDensityFolder,
        IconLauncherShape and MonochromeLauncherIcon are all silent and
        legitimately so, with no lint.xml or baseline suppressing anything.
        Unit tests green.
      not_verified: >
        The themed/monochrome layer was exercised on the emulator by the first
        attempt (Wallpaper & style, Icons, Minimal) and rendered system-tinted,
        but that check has not been repeated against the corrected geometry.
        The icon has not been seen on the physical Galaxy S25.
    - id: "release-build-never-produced"
      title: "No release build has ever been assembled, and the R8 path is unexercised"
      status: resolved
      origin: "Found on 2026-09-02 while choosing a build type to install for hands-on testing."
      reason: >
        app/build.gradle.kts has no `signingConfigs` block, so a release APK
        would be unsigned and uninstallable. Separately, the `release` build type
        sets `isMinifyEnabled = true` and `isShrinkResources = true`, and that
        configuration has never been built even once.
      why_it_matters: >
        R8 over Room, Hilt and kotlinx-serialization is exactly where
        reflection-adjacent breakage hides, and none of it would be caught by
        any current gate: `check` runs unit tests, lint and detekt on debug
        sources only. Every test number this project has ever reported is from a
        debug build. The first release build is therefore an unknown, and it sits
        between here and any distribution.
      owner_condition: >
        Its own PR: add a signing config (a local keystore kept out of the repo),
        assemble release, install it, and run the instrumented suite against the
        minified build. Expect proguard rules to be needed.
      resolution: >
        Done on 2026-09-02. The project's first release build exists and has been
        exercised, not merely compiled.

        WHAT THE SIGNING CONFIG NEEDED. A top-level `Properties()` in
        app/build.gradle.kts loaded from `rootProject.file("keystore.properties")`
        behind an `if (file.exists())` guard, a `signingConfigs` block that only
        calls `create("release")` when `storeFile` is actually present, and
        `signingConfig = signingConfigs.findByName("release")` inside
        `buildTypes.release`. Both guards are load-bearing rather than defensive:
        the keystore and its properties file are gitignored, so without them a
        fresh clone would fail at CONFIGURATION time and could not even build
        debug. The guard was not assumed to work — keystore.properties was
        temporarily moved aside and both variants rebuilt: debug succeeds, and
        assembleRelease also succeeds but emits `app-release-unsigned.apk`
        instead of `app-release.apk`, so the secret is only ever needed to
        produce something installable. Mirrors the pattern already proven in the
        sibling sleep-noise-android project.
        isMinifyEnabled/isShrinkResources were left exactly as they were.

        WHICH PROGUARD RULES WERE NEEDED: NONE. This is the headline finding and
        it contradicts the owner_condition's own expectation above, so it was
        checked three separate ways rather than inferred from a green build.
        `:app:assembleRelease` succeeded on the very first attempt with an empty
        rules file. The release DEX was then inspected directly and every
        reflection-adjacent symbol this app depends on survives: Room's
        `AppDatabase_Impl` is present unobfuscated (androidx.room's own consumer
        rule keeps it), HiltWorkerFactory's five worker class-name map keys
        survive as string literals with the worker classes unobfuscated,
        manifest-declared components are kept by the AAPT-generated rules, and
        kotlinx-serialization needs nothing because every call site passes an
        explicit `BackupFile.serializer()` instead of the reflective
        `serializer(typeOf<T>())` path. Two rules commonly added by reflex were
        tested and rejected: `-keepattributes SourceFile,LineNumberTable` is
        redundant because R8 8.x already writes sourceFile records and line
        mappings into mapping.txt (proven by feeding an obfuscated frame to
        cmdline-tools retrace, which recovered
        `BackupImporter.insertHabit(BackupImporter.kt:113)` exactly), and a
        blanket `-keep class com.jjrapps.constanza.** { *; }` would defeat the
        shrinking this build type exists for. app/proguard-rules.pro now records
        that evidence in place of its former speculative note, so the next reader
        does not add a defensive blob on a hunch.

        SIGNATURE VERIFIED. `apksigner verify --print-certs` (build-tools 37.0.0)
        reports one signer, `CN=Constanza, OU=jjrapps, O=jjrapps, L=Unknown,
        ST=Unknown, C=ES`, RSA 4096, certificate SHA-256
        59659af67e6ae8dd806e7cc9fe4ff575f3bd0e8237adfb971735323e64c912d0.
        Schemes present: v2 only. v1 is off because minSdk is 31, and v3 is off
        because that is the AGP default — worth knowing before key rotation is
        ever wanted, though Play App Signing makes it moot for store delivery.

        SIZE. Release 3,059,614 bytes (2.9 MiB) against debug 36,489,028 bytes
        (35 MiB), both freshly assembled from the same tree. R8 and resource
        shrinking are doing real work.

        RUNTIME VERIFICATION, AND EXACTLY WHERE. The signed release APK was
        installed on the running API 37 emulator (emulator-5554,
        sdk_gphone16k_arm64) and driven by hand through: cold launch, the
        onboarding welcome and notification-permission steps including the real
        POST_NOTIFICATIONS system dialog, creating and saving a habit, answering
        it Yes on Today, the Progress screen computing streak and compliance, a
        backup export written through the SAF picker and read back off the device
        as correct JSON with correct field names, and a backup import replacing
        all data. The reflective worker chain was exercised for real rather than
        simulated: a habit was given a reminder two minutes out, the RTC_WAKEUP
        alarm fired into `.scheduling.ReminderFireReceiver`, WorkManager logged
        `Worker result SUCCESS` for ReminderFireWorker, the notification posted on
        the `reminders` channel with its three actions and accent colour, and
        tapping its Yes action dispatched through ActionReceiver into AnswerWorker
        (also SUCCESS) whose Room write then showed up on Today as
        "14:15 — COMPLETED". Zero FATAL/AndroidRuntime entries in logcat across
        the whole session and zero dropbox crash entries.

        CAVEATS — WHAT WAS NOT VERIFIED. (1) The instrumented suite was NOT run
        against the minified build, so the owner_condition above is only partly
        met. Doing that needs `testBuildType = "release"`, and a minified
        androidTest variant would in turn need keep rules for the test classes
        themselves — a defensive blob whose only purpose is to make the tests
        link, which would obscure exactly the signal this item was opened to get.
        The hand-driven exercise above was chosen instead, deliberately. The debug
        matrix still passes unchanged. (2) The five boot/time/package reschedule
        receivers could not be triggered: their intents are protected system
        broadcasts that adb cannot send, so BootReceiver, PackageReplacedReceiver,
        TimeChangeReceiver and ExactAlarmPermissionReceiver are unproven under
        R8 — they are structurally identical to ReminderFireReceiver and
        ActionReceiver, which both work, but that is an inference and not a
        measurement. (3) MidnightSweepWorker and ReconcileWorker never actually
        ran; WorkManager refuses to execute periodic work ahead of schedule, so
        only their enqueue was observed. (4) Nothing was verified on physical
        hardware and nothing was installed on the maintainer's phone. (5) Room
        has no migrations yet, so the migration path under R8 is untested by
        construction.
    - id: "exact-alarm-banner-false-positive-question"
      title: "Unresolved: did the exact-alarm banner show on a device where the permission is allowed?"
      status: resolved
      severity: "unverified — an open question, not a confirmed defect"
      origin: >
        On 2026-09-02 the maintainer reported seeing a button in the app that led
        to an OS settings screen, on a device where
        `cmd appops get com.jjrapps.constanza SCHEDULE_EXACT_ALARM` reports
        `allow`. TodayScreen renders the banner only under
        `if (!state.canScheduleExactAlarms)`, and TodayUiState defaults that
        field to `true`, so neither the granted state nor the pre-emission
        default should have shown it.
      reason: >
        The evidence is ambiguous and the ambiguity is self-inflicted: a blind
        `adb shell input tap` during exploration navigated the device into the
        exact-alarm settings screen at around the same time, so it cannot now be
        told apart from a banner tap. Do not record this as a bug on that basis.
      why_it_matters: >
        If the banner really does show while exact alarms are allowed, it tells
        every user their reminders may be late when they will not be — and on One
        UI, AlarmManager.canScheduleExactAlarms() diverging from the appop would
        be worth knowing about in its own right.
      owner_condition: >
        Cheap to settle: install clean on a device with the appop allowed, launch,
        screenshot before touching anything, and read whether the banner is
        present. Do not blind-tap on someone's daily device.
      resolution: >
        Not a defect. Settled by the maintainer from their own side rather than
        by a new measurement: the only prompt they ever saw was "a button in the
        app leading to an OS settings screen", which is precisely ExactAlarmBanner
        behaving as designed on a device where SCHEDULE_EXACT_ALARM was still
        denied. The `cmd appops get com.jjrapps.constanza SCHEDULE_EXACT_ALARM`
        reading of `allow` was taken AFTER they had granted the permission
        through that very banner, so the reading and the banner describe two
        different moments in time and never actually contradicted each other.
        There is nothing left to reproduce: TodayScreen's
        `if (!state.canScheduleExactAlarms)` gate and TodayUiState's `true`
        default are correct as written.
      process_note_preserved: >
        The reason this stayed open as long as it did is worth keeping. A blind
        `adb shell input tap` during exploration navigated the device into the
        exact-alarm settings screen at about the same time, which made the
        evidence unreadable and turned a non-event into an open question. Do not
        blind-tap on someone's daily driver; take a screenshot and read it first.
