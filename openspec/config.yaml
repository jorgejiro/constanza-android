    - id: "notification-permission-blocked-after-one-ask"
      title: "Constanza flips to BLOCKED after one denial, spending the user's second native prompt early"
      status: open
      origin: >
        Recorded on 2026-09-02 by first-run-onboarding's design.md §2.3, while designing the
        onboarding permission screen. This conservatism predates that change;
        first-run-onboarding is what makes it the common path rather than a rare one, since every
        install now reaches the permission ask through onboarding.
      reason: >
        `NotificationPermission.decide` treats any prior ask as permanent: it cannot tell "the
        user was asked once and denied" apart from "the system has permanently blocked further
        prompts", because that distinction needs `shouldShowRequestPermissionRationale`, which
        needs an `Activity` reference the class deliberately does not hold (see its own KDoc).
        `ReminderSettingsStore.hasRequestedNotificationPermission()` is a single boolean latch, set
        the first time the dialog is shown, whatever the answer. So a user who denies once during
        onboarding immediately loses the second native prompt Android would still have shown them,
        and is routed to system settings instead.
      why_it_matters: >
        The error direction fails safe — the approximation can only ever under-prompt, never
        over-prompt, and `BLOCKED` always offers `ACTION_APP_NOTIFICATION_SETTINGS` as a working
        way out, never a dead end. But it does cost a real user a real extra tap through system
        settings where the platform would otherwise have shown a second in-app dialog, and
        first-run-onboarding made that cost visible on every fresh install rather than hidden
        behind a Today banner most users never tapped.
      owner_condition: >
        Any future change that is already touching `NotificationPermission`'s Activity-free
        contract. Fixing it standalone means giving the decision table an `Activity` reference (or
        an equivalent capability) it deliberately does not have today, which is a bigger change
        than the gap it closes; it is cheap only when a change that already needs that reference
        lands anyway.

    - id: "no-shared-time-of-day-formatter"
      title: "The app never honours the device's 12/24-hour setting; every screen hardcodes 24-hour"
      status: resolved
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, which was auditing the habit editor for
        WCAG 1.4.11 non-text contrast and read the reminder-time code paths on the way through.
        The gap predates that change and is untouched by it.
      reason: >
        There is no one place that renders a time, so there is nothing to teach. `TodayScreen`
        holds a hardcoded `HH:mm` `TIME_FORMATTER` and, separately, its own `"%02d:%02d"` literal
        in `slotStatusText`; the habit editor's reminder rows format their own. None consults
        `android.text.format.DateFormat.is24HourFormat(context)`, so a user whose device is set to
        12-hour sees `21:15` everywhere regardless.
      why_it_matters: >
        It is a locale-correctness gap rather than a defect: the times shown are accurate, just
        not in the notation the user chose system-wide. It is listed because the natural fix is
        cheap and structural — one shared `formatTimeOfDay(minuteOfDay, is24Hour)` that every call
        site reads — and because the duplication that makes it a gap will otherwise keep growing:
        the same literal already exists twice in `TodayScreen` alone, and the unmerged time-picker
        work adds a third copy whose KDoc explicitly notes it is matching `slotStatusText`
        "character for character" precisely because no shared helper exists.
      owner_condition: >
        No blocker, but it must be done app-wide in one change or not at all. Converting a single
        screen would put `9:15 PM` in the editor and `21:15` on Today for the same slot, which is
        worse than one consistent convention. Any change already touching how times are rendered
        on more than one screen should absorb it.
      resolution: >
        Shipped app-wide in one change on branch fix/time-format-consistency, as the
        owner_condition required. `core/ui/TimeOfDayFormat.kt` holds the app's one renderer:
        `class TimeOfDayFormat(val is24Hour: Boolean, locale: Locale)` with
        `format(minuteOfDay: Int)` and `format(time: LocalTime)`, plus a
        `@Composable rememberTimeOfDayFormat()` that reads `DateFormat.is24HourFormat(context)`
        and `LocalConfiguration.current.locales[0]`. All three previous copies are gone:
        `TodayScreen`'s `TIME_FORMATTER` constant, its separate `"%02d:%02d"` literal in
        `slotStatusText`, and `ReminderTimeField`'s private `formatTimeOfDay`. `ReminderTimeField`
        reads the format ONCE and hands the same object to the row and to
        `rememberTimePickerState(is24Hour = ...)`, so the row and the picker it opens cannot
        disagree.

        FORMATTED BY HOUR CYCLE, NOT BY LOCALE — stated because the item asked. The digit layout is
        the app's (`HH:mm` / `h:mm a`) and only the day-period marker comes from the locale (`PM` in
        en-US, lower-case `pm` in en-GB, `p. m.` in es-ES; the en-GB case is pinned as its own unit
        test because an earlier draft asserted `PM` there and failed). `DateTimeFormatter`'s
        `ofLocalizedTime(SHORT)` was rejected outright: it derives the hour cycle from the LOCALE, so
        a US-English phone switched to 24-hour would still be handed `9:15 PM` — the exact defect
        this item is about. The setting has to beat the locale, and only an explicit pattern lets it.
        Zero padding survives where it means something: both halves in 24-hour (`21:05`, `08:00`), the
        minute only in 12-hour (`9:05 PM`, not `09:05 PM`, which is not a convention anywhere).

        Reading the 12/24 setting is not a clock read, so detekt's `ForbiddenMethodCall` ban is
        untouched and uncircumvented — every actual instant still arrives through `TimeProvider`.
        Known limit, recorded in the KDoc rather than hidden: Android keeps that preference in
        `Settings.System`, not in `Configuration`, so flipping it while the app is foregrounded shows
        up on the next Activity creation rather than immediately.

        THE TERTIARY-ROLE PROBLEM, WHICH IS THE ACTUAL RISK IN THIS CHANGE. `ReminderTimeField`'s old
        KDoc gave two reasons for hardcoding 24-hour. The first (internal consistency with Today)
        dissolves here. The second did not, and was re-verified against the resolved
        material3-android-1.4.0 sources rather than taken on trust: in BOTH `TimePickerTokens` and
        `TimeInputTokens` the only tertiary entries are `PeriodSelectorSelectedContainerColor`
        (`TertiaryContainer`) and the four `PeriodSelectorSelected*LabelTextColor` (`OnTertiaryContainer`)
        — nothing else in either table is tertiary — and `Theme.kt` audited that whole family as
        deliberately unbound on the grounds that nothing rendered it. Following the device setting
        renders the AM/PM selector, which would have put M3's stock violet in the warm ramp.

        Fixed in the theme rather than by overriding colours at the one call site, so the next
        component to reach for a tertiary role inherits a warm tone instead of repeating the
        override. `Theme.kt` now binds `tertiaryContainer`/`onTertiaryContainer` to the same
        `SurfaceSelected`/`Accent` pair `primaryContainer`/`onPrimaryContainer` already uses — both
        are "this half of a two-part selector is the one you picked", and the AM/PM toggle sits a few
        dp from the hour/minute selector inside the same dialog — and `tertiary`/`onTertiary` onto the
        accent pair, following the existing `secondary` decision. No new hex values. That file's role
        audit no longer lists the tertiary family as unbound; it explains the binding instead.

        `ColorContrastTest` gained four assertions for it: that none of the four roles is still M3's
        stock dark default (compared against `darkColorScheme()` itself, so it keeps meaning "not
        Material's default" across an upgrade rather than pinning today's hex); that
        `onTertiaryContainer` clears 4.5:1 on `tertiaryContainer`; that `onSurfaceVariant` — the
        unselected label, drawn over the dialog's own `surfaceContainerHigh` because M3 makes the
        unselected period container transparent — clears 7:1 there; and that the selected and
        unselected label tones cannot collapse into one. SC 1.4.11 for the component itself is
        already covered: M3 strokes the whole toggle with `outline`, which the existing sweep
        measures on every surface.
      verified: >
        `:app:testDebugUnitTest` 181 tests, 0 failures — 20 of them the new `TimeOfDayFormatTest`
        (both cycles across midnight, noon, 00:05, 23:59, 11:59, the LocalTime overload, and the
        locale cases) and 25 `ColorContrastTest`, four of those new. `:app:detekt`, `:app:detektMain`
        and `:app:lintDebug` green. `:app:emulatorMatrixGroupDebugAndroidTest` green on both legs,
        93 tests each (api31 0 failures 2 skipped, api37 0 failures 1 skipped), up from 91: one new
        Today test asserting the whole `<time> — <status>` sentence in the device's notation and the
        other notation's absence, and one asserting the picker offers an AM/PM selector exactly when
        the device says 12-hour. Four existing instrumented tests were UPDATED rather than loosened
        — `HabitEditorTimePickerComposeTest`, `HabitEditorRotationComposeTest`,
        `TodayAdaptiveComposeTest`, `TodaySlotRowComposeTest`. Each still compares against a
        hand-written literal; the device's setting only chooses WHICH of two literals applies, via
        `androidTest`'s `expectedTimeOnDevice`. That helper deliberately does not call
        `TimeOfDayFormat`: asking production what it would print and asserting it printed that would
        prove only that the screen called it. Both matrix emulators leave `time_12_24` unset with an
        `en-US` locale, so both legs actually ran the 12-hour branch.

        LOOKED AT, NOT ONLY MEASURED. Screenshotted on a booted `Constanza_API31` emulator (the
        physical device was never touched) with the seeded `Meditate` habit, first at
        `settings put system time_12_24 12` and then at `24`, force-stopping between the two because
        Android carries that preference in `Settings.System` rather than in `Configuration`.
        12-hour: Today reads `9:50 PM — Pending`; the reminder row reads `8:00 AM`; the dial dialog
        renders the AM/PM toggle with the selected `AM` in the accent amber, the unselected `PM` in
        off-white, and a warm-grey `ControlStroke` border around the pair; the keyboard-entry dialog
        renders the same toggle. 24-hour: `21:50 — Pending`, `21:50`, no period selector at all, and
        the dialog is pixel-wise what it was before this change. NO VIOLET ANYWHERE in either state —
        the tertiary binding holds on a real screen, not only in the contrast test.

        One honest observation from those screenshots rather than a claim of perfection: the selected
        period's container is `SurfaceSelected` and its unselected sibling is transparent over
        `surfaceContainerHigh`, and at these two ramp tiers those two fills are all but
        indistinguishable — the selection is carried entirely by the amber label. That is the trade
        `Theme.kt` already documents for every selected fill in this palette and it is conformant
        (SC 1.4.11 is satisfied by the toggle's own `outline` border, which identifies the
        component), but it is the same hue-carried distinction the theme's own KDoc flags as the
        thing to revisit if the surface ramp is ever re-toned.

    - id: "fab-and-selected-chip-fills-below-the-non-text-floor"
      title: "Two filled controls identify themselves by a 1.17:1 fill; only their content carries them"
      status: open
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, which fixed every *stroked* control's
        WCAG 1.4.11 contrast and measured, but deliberately did not change, the *filled* ones.
      reason: >
        `FloatingActionButton` fills with `primaryContainer` and the selected `FilterChip` fills
        with `secondaryContainer`; both are `ConstanzaColors.SurfaceSelected`, which measures
        1.17:1 against `Background` — below SC 1.4.11's 3:1. Raising either is not a tuning
        exercise: 3:1 against `Background` needs relative luminance >= 0.111, and the whole surface
        ramp tops out at 0.0092, so any conforming fill is a light slab rather than a surface tone.
      why_it_matters: >
        Both controls remain identifiable, which is why this is an open item and not a defect:
        SC 1.4.11 is satisfied by any boundary that identifies the component, and the FAB has
        Material's own elevation shadow plus (after this change) an accent `+`, while the selected
        chip gained an accent stroke. What is missing is a fill that carries them on its own. Note
        the FAB's glyph is now `onPrimaryContainer` = `Accent`, so it reads 8.11:1 against its own
        container rather than the 13.98:1 the old off-white gave — still far above any floor, and
        traded deliberately for marking the app's primary action in the accent.
      owner_condition: >
        Any change that revisits the surface ramp itself, or one that decides the FAB should be a
        filled accent button (`primaryContainer` = `Accent`, `onPrimaryContainer` = `OnAccent`).
        That second option was considered and rejected here only because it would also turn M3's
        time-picker selected-hour box into a solid amber block, which the unmerged time-picker
        work had already judged too loud on a real screenshot — an argument that stops applying
        the moment that work ratifies a different look.

    - id: "control-stroke-overrides-are-not-guarded-by-a-test"
      title: "Three call sites must opt into ConstanzaControlDefaults, and nothing fails if a fourth forgets"
      status: resolved
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, as a known limit of the guard that change
        introduced rather than a discovery about existing code.
      reason: >
        material3 1.4.0 routes `OutlinedButton` and unselected `FilterChip` borders through
        `outlineVariant`, the decorative-divider role, alongside `HorizontalDivider`. One token
        cannot clear the 3:1 floor and stay a hairline, so those controls take their stroke from
        `ConstanzaControlDefaults` by hand. `ColorContrastTest` asserts the tones and the role
        bindings — it reads the real `ColorScheme`, so it catches a rebinding — but it cannot see
        a call site that never calls in.
      why_it_matters: >
        The failure is silent and looks exactly like the defect this change fixed: a new
        `OutlinedButton`, `AssistChip`, `InputChip`, `SuggestionChip`, `OutlinedCard` or
        `OutlinedIconButton` added later will take M3's default border and be invisible, with a
        green test suite. The same applies to any future `HorizontalDivider`, in reverse: it will
        correctly get the quiet tone, which is right, but nothing states that intent at the call
        site.
      owner_condition: >
        A lint rule or a detekt `ForbiddenMethodCall` on `ButtonDefaults.outlinedButtonBorder` and
        `FilterChipDefaults.filterChipBorder` would close it mechanically and is the cheapest real
        guard. Worth doing when a fourth such control appears, which is the point at which the
        convention stops being memorable from the three existing examples.
      resolution: >
        Closed on 2026-09-02 by test/guard-control-strokes with two guards, because the suggested
        one turned out to close only half of it.

        Guard 1, the detekt ban the owner_condition named, in `config/detekt/detekt.yml`:
        `ForbiddenMethodCall` now forbids eight Material default border factories —
        `ButtonDefaults.outlinedButtonBorder`, `FilterChipDefaults.filterChipBorder`,
        `AssistChipDefaults.assistChipBorder`, `SuggestionChipDefaults.suggestionChipBorder`,
        `InputChipDefaults.inputChipBorder`, `CardDefaults.outlinedCardBorder`,
        `IconButtonDefaults.outlinedIconButtonBorder` and
        `IconButtonDefaults.outlinedIconToggleButtonBorder`. Each carries a reason naming the token
        it resolves to. The eight were chosen by reading the resolved tokens in
        `material3-android-1.4.0-sources.jar` rather than by pattern-matching on names: every one
        resolves to `ColorSchemeKeyTokens.OutlineVariant`. `OutlinedTextField` is deliberately not
        banned, because `OutlinedTextFieldTokens.OutlineColor` resolves to `Outline`, the
        control-stroke role, so its default is already correct here. `ControlDefaults.kt` is the
        single exempted adapter, the same shape as `TimeProvider.kt` for the clock ban.

        Guard 2, `ControlStrokeCallSiteTest`, which exists because guard 1 alone does not close the
        item. The reported defect is a control added with NO border argument, and such a call site
        calls nothing forbidden — the default is evaluated inside material3, so no banned name
        appears in our source at all. Probed on exactly that: `OutlinedButton(onClick = {}) { Text(…) }`
        planted in `core/ui/theme/` passes `:app:detektMain` cleanly. The test therefore asserts the
        other direction, over `app/src/main/kotlin` as text: every call to any of eight guarded
        composables must pass `border = ConstanzaControlDefaults.…`. It covers the three existing
        call sites by construction, so an edit that strips the argument back off one of them fails
        too, and it asserts its own reach (file count and a floor on call sites found) so a scan
        that reads nothing cannot pass.
      resolution_enabler: >
        The detekt half needed a build fix first, and it retires a "KNOWN GAP" that
        `app/build.gradle.kts` had recorded as an unfixable AGP 9 limitation. That comment said
        `ForbiddenMethodCall` cannot fire in `:app` because the hand-rolled `detektMain` task
        obtains no type resolution under AGP 9. The observation was right and the diagnosis was
        wrong: the task's classpath was unreadable. `debugCompileClasspath` resolves to what the
        dependency graph holds, which for an Android app is mostly `.aar` files — measured at 70 of
        92 entries — and the Kotlin frontend cannot read an `.aar`. `android.jar` was missing
        entirely. Requesting the `android-classes-jar` artifact view and adding
        `androidComponents.sdkComponents.bootClasspath` fixes both, and semantic rules now resolve
        Compose and AndroidX symbols. That is also why the old probe was so convincing:
        `java.time.LocalDate.now()` needs no classpath entry, so the one symbol anybody thought to
        plant was the one symbol that resolved either way.

        Turning resolution on surfaced exactly one finding in existing code: `InjectDispatcher` on
        `replanAsync`, the shared `goAsync()` helper behind five BroadcastReceivers. It is a
        top-level private function with nowhere to inject, so it is excluded by file in the detekt
        config with that reason stated, rather than the rule being switched off.

        The side effect is that the clock ban is now genuinely enforced in `:app` instead of resting
        on the TimeProvider convention and review, which is what the old comment said it rested on.
      verified: >
        Every claim above was probed in both directions rather than reasoned about.

        Guard 1 fires: `border = ButtonDefaults.outlinedButtonBorder(enabled = true)` planted in
        `core/ui/theme/GuardProbe.kt` fails `:app:detektMain` with
        "The method `androidx.compose.material3.ButtonDefaults.outlinedButtonBorder` has been
        forbidden". Removed, the task passes.

        Guard 1's blind spot is real: `OutlinedButton(onClick = {}) { Text("probe") }`, with no
        border argument, passes `:app:detektMain` — BUILD SUCCESSFUL. That is the planted defect
        this item was filed about.

        Guard 2 fires on that same snippet: `ControlStrokeCallSiteTest` fails with
        "GuardProbe.kt:10 OutlinedButton(…)". It also fires on a border sourced from Material
        (before that half was handed to detekt), on a correct border nested inside a content lambda
        of an otherwise-unguarded control, and — the regression direction — on deleting
        `border = ConstanzaControlDefaults.filterChipBorder(selected = isSelected)` from the
        existing `ScheduleEditors.kt:232` chip, which failed with exactly that line.

        The classpath fix was probed by subtraction: with the artifact view and the platform in
        place, `ForbiddenMethodCall` fires on both `java.time.LocalDate.now()` and the real
        `ButtonDefaults.outlinedButtonBorder` call in `ControlDefaults.kt:62`; with the artifact
        view removed, the compose entry stops firing while `java.time` keeps firing; before either
        change, neither fired.

        Suite, all with no probe in the tree: `:app:detekt`, `:app:detektMain`, `:domain:detekt`,
        `:domain:detektMain`, `:app:lintDebug` all BUILD SUCCESSFUL; `:app:testDebugUnitTest` 157
        tests, 0 failures (155 before the 2 added here); `:domain:test` 52 tests, 0 failures.

    - id: "today-slot-row-compose-test-timeout-flakiness"
      title: "TodaySlotRowComposeTest's awaitNodeWithText helper is the sole source of every matrix flake seen across two verify sessions"
      status: resolved
      severity: "non-blocking for any change so far, but the matrix is not currently a trustworthy binary pass/fail gate at its default settings"
      origin: >
        Surfaced across two separate `sdd-verify` sessions for unrelated changes. This change
        (`onboarding-exact-alarm-ask`)'s own launch brief already recorded two known flakes going
        into its second correction round —
        `theAnswerLabelsStayOnOneLineNextToALongHabitNameOnAPhone` and `TodayAddHabitComposeTest`'s
        add-action test. The second correction round's re-verify then re-ran the matrix three times
        (as instructed, to avoid attributing a failure without a re-run) and hit it twice more, each
        time a different method and a different API leg: `theSlotTimeReadsInTheDeviceHourCycle[api37]`
        and `anAnsweredSlotReadsAsCopyRatherThanTheEnumConstant[api31]`. That is four distinct flaky
        methods now observed, all in this one file, all through the same helper.
      reason: >
        Every failure is `ComposeTimeoutException` from `TodaySlotRowComposeTest`'s private
        `awaitNodeWithText` helper (`WAIT_TIMEOUT_MS = 15_000L`), after 15 seconds. `git diff --stat`
        against this change's base commit confirms `TodaySlotRowComposeTest.kt` was never touched by
        `onboarding-exact-alarm-ask` — this is pre-existing and environmental, not a regression the
        change introduced. The file's own KDoc on `WAIT_TIMEOUT_MS` already documents the same failure
        mode once: the timeout was raised from an original 5s to the current 15s after the identical
        "identically-seeded siblings pass, this one blows the wait under load" pattern was measured
        under the full suite. Raising it once did not close the gap; two of three fresh
        `--rerun-tasks` matrix runs in one session still failed here, hitting a third and fourth
        distinct method never previously flagged.
      why_it_matters: >
        A 2-of-3 failure rate in one session, landing on a third and fourth distinct method each
        time, is materially worse than "timed out once and passed on retry" — the framing the first
        flake report used. It has never once affected a scenario unrelated to `TodaySlotRowComposeTest`
        itself: across both sessions, every other test in the matrix (including, in this change,
        60/60 `OnboardingComposeTest` executions across three full runs) passed without exception.
        But a matrix that intermittently fails on an untouched file costs a future verify session real
        time re-running and re-attributing, which is exactly the failure mode
        `compose-test-db-teardown-race` above was filed to prevent for a different mechanism.
      owner_condition: >
        Not fixed here — this item is unrelated to `onboarding-exact-alarm-ask`'s own scope and
        belongs to its own change. `sdd-verify`'s own suggestion, recorded verbatim: either a
        documented retry-once policy for the managed-device matrix task, or a targeted look at
        `TodaySlotRowComposeTest`'s `awaitNodeWithText` helper specifically — raising the timeout
        further, or an explicit `@FlakyTest`-equivalent quarantine — since it is now the sole source
        of every observed matrix flake across two consecutive verify sessions and four distinct
        methods.

      escalation_2026_09_03: >
        Worse than first recorded, and no longer confined to one test class.
        habit-deletion's verify phase ran the matrix twice on identical bytes:
        api31 was clean both times, and api37 failed BOTH times, each on a
        different Today-screen compose test — TodayAddHabitComposeTest on one
        run and TodaySlotRowComposeTest on the other, both
        ComposeTimeoutException at exactly 15000 ms. The apply phase's single
        clean run did not reproduce.

        Two things change with this. The pattern is a bounded-wait problem
        across the whole tracking package, not a defect in one helper. And the
        api37 leg is now failing roughly every run for reasons unrelated to
        whatever change is under test, which means the matrix has stopped being
        a gate anyone can read: the next person to see it red will re-run
        rather than investigate, and the run after that will be believed for
        the wrong reason.

        Fix this before it swallows a real regression. The deadline is not
        hypothetical: every change since the item was filed has carried the
        instruction "re-run before attributing a failure to yourself", which is
        exactly the habit that teaches people to ignore red.

      resolution: >
        Fixed on branch `fix/tracking-bounded-wait-flake` by measuring the one
        thing every previous round of this item argued about instead of measured.

        WHAT WAS MEASURED. Every bounded wait in `app/src/androidTest/.../tracking/`
        was temporarily instrumented to record how long it actually took and what
        `TodayViewModel.uiState` held the moment it ended, and one full api37
        suite run was captured through UTP's per-test logcat. The eleven waits
        that satisfied took 2, 5, 15, 18, 24, 24, 27, 28, 69, 87 and 88 ms — a
        24 ms median and an 88 ms worst case against a 15,000 ms bound. The
        twelfth, `TodayAddHabitComposeTest.aPopulatedTodayShowsTheTrailingAddActionAndNoCentredOne`,
        timed out at 15,011 ms with the ViewModel still reporting `rows=0`.

        That settles the question the item was stuck on. The failing wait is not
        170x slower than its siblings; it is waiting for something that was never
        coming. Nothing was in flight at fifteen seconds, so the move this item
        had already made once — 5s to 15s — could not have helped then and would
        not help now. It only made each occurrence cost ten more seconds.

        THE MECHANISM, proven rather than inferred. The seed every flaking test
        used wrote three rows in three separate transactions: `habitDao.insert`,
        then `scheduleDao.upsert`, then `reminderSlotDao.insert`. Room's
        `InvalidationTracker` fires per commit, so that publishes "a habit with
        no schedule" as a state a live observer can receive.
        `TodayViewModel.uiState` observes `habits`, `entries` and
        `reminder_occurrences`, but reads each habit's schedule and slots
        imperatively inside its `combine`, and a habit whose `findScheduleFor`
        returns null is dropped by `mapNotNull`. The `schedules` and
        `reminder_slots` writes that follow invalidate tables that `combine` does
        not observe, so no second emission ever comes and `rows = 0` is
        permanent.

        A temporary `MechanismProbeTest` forced that interleaving and confirmed
        it deterministically on the **api31** leg — the one that had never been
        seen to flake. Habit first, 750 ms pause, then schedule and slot, then a
        further 750 ms: the screen was still at `rows=0` four seconds later. The
        same three writes inside one transaction reached it in 17 ms. api31 was
        never immune to this; it was winning a race that the heavier api37
        `google_apis` image loses far more often. That probe was deleted once it
        had done its job, and its numbers are recorded here instead.

        THE FIX is atomicity at the seed, plus a wait that can tell the two
        failures apart.

        `HabitRepositoryTestFixture.seedHabitWithEnabledSlot` writes the habit,
        its schedule and its enabled slot in one transaction, so the tracker
        fires once, after commit, and a half-built habit is not an observable
        state at all. `AppDatabase.insertHabitWithSchedule` is transactional for
        the same reason, which covers its worker-test callers too. This is the
        cause, not the symptom: there is no intermediate state left to lose a
        race to.

        The four duplicated `WAIT_TIMEOUT_MS = 15_000L` constants and four
        near-identical node-wait helpers are gone, replaced by one
        `TodayScreenWaits.kt` — the "one correct fix, applied to every sibling"
        this repository keeps getting wrong. The tests now wait on
        `TodayViewModel.uiState` (Room's own emission) BEFORE `setContent`, which
        is exactly what `TodayComposeTest`'s KDoc had been recommending for two
        changes while every class went on waiting for a node anyway. The
        composition then renders from a state that already holds the rows, on its
        first frame, so the node wait it replaces has nothing left to wait for.
        Its 5s bound is a diagnostic tripwire at ~57x the measured worst case,
        not headroom, and it fails with the state it actually saw rather than
        `Condition still not satisfied after 15000 ms` — the message that let the
        last four occurrences be re-run instead of investigated.

        VERIFIED. `:app:testDebugUnitTest`, `:app:detekt`, `:app:detektMain` and
        `:app:lintDebug` all clean. `:app:emulatorMatrixGroupDebugAndroidTest
        --rerun-tasks` was run FOUR times end to end, and every run passed both
        legs: 113 tests on api31 and 112 on api37 each time, parsed out of the
        result XML with `xml.etree.ElementTree` rather than by eye — 222
        executed, 0 failures, 0 errors, 3 skipped, per run. Runs 2, 3 and 4 are
        on byte-identical sources; run 1 differs only in an import tidy-up
        applied after its APK was packaged, and is reported rather than quietly
        recounted. For contrast, the instrumented api37 run taken BEFORE the fix,
        on the same machine and the same emulator images, failed on its first
        attempt.

        WHAT THIS DOES NOT PROVE. A race can never be proven absent, and this one
        is no exception: N green runs are evidence, not a proof, and the
        pre-existing `compose-test-db-teardown-race` shows this suite has more
        than one timing-shaped failure mode in it. What is proven is narrower and
        stronger than a run count: the specific interleaving that produced every
        observed occurrence is no longer expressible, because the three writes it
        needed are now one write. The new item
        `today-rows-are-built-from-tables-the-screen-does-not-observe` records
        the production-side fragility this investigation uncovered, which the
        test-side fix removes the trigger for but not the cause of.

    - id: "today-never-rolls-over-at-midnight"
      title: "TodayViewModel captures the date once at construction, so an open screen still shows yesterday after midnight"
      status: resolved
      severity: >
        Reachable by an ordinary user with no unusual sequence: open the app
        before midnight, leave it backgrounded, come back after. The screen is
        the one the app exists for, and it silently shows the wrong day's
        entries while looking completely normal.
      origin: >
        Found on 2026-09-03 while verifying the severity of
        `today-rows-are-built-from-tables-the-screen-does-not-observe` rather
        than taking it at face value. That item turned out to be a fragility no
        production writer can reach; this one, found in the same file two lines
        away, is a live defect and had never been recorded.
      reason: >
        `TodayViewModel.kt:79` reads `private val today = timeProvider.today()`
        — a property initialiser, evaluated exactly once when Hilt constructs
        the ViewModel. It then feeds `entryDao.observeByDate(today.toString())`,
        so the Room flow is bound for the ViewModel's whole lifetime to the date
        that was current at construction. A ViewModel survives configuration
        changes and backgrounding; it dies only with its scope. Nothing
        recomputes the date, and no source in the combine emits on a day change,
        so no recomposition can correct it either.
      why_it_matters: >
        The failure is silent and durable, the same shape as this file's other
        expensive lessons: not an error, but a screen that is quietly wrong. A
        user who crosses midnight with the app open sees yesterday's slots,
        answers them, and writes entries against yesterday's date. There is no
        visible cue that the day on screen is not today.

        Note the domain-side midnight rule is unaffected and already specified:
        `habit-entry-tracking`'s Midnight Transition requirement governs
        `UNKNOWN` becoming `MISSED`, and it is enforced elsewhere. This is
        purely the screen failing to follow the clock.
      owner_condition: >
        Its own change. The date must become an observed source rather than a
        captured value, which means the entry flow has to re-subscribe when the
        day changes — `flatMapLatest` over a date flow, not another element in a
        `combine` that is already at its largest typed overload. Two triggers are
        worth weighing rather than assuming one: a timer scheduled to the next
        local midnight, and the system's own `ACTION_DATE_CHANGED` /
        `ACTION_TIMEZONE_CHANGED` broadcasts, which also cover a manual clock
        change and travel across time zones that a pure timer misses. Whichever
        is chosen it must go through `TimeProvider` — direct clock reads are
        banned by detekt's `ForbiddenMethodCall` and the ban is enforced.
        Do not close this with a poll or a refresh-on-resume alone: resume does
        not fire for an app that is already foregrounded at midnight.
      resolution: >
        The date became an observed source: a `CurrentDateSource` port emitting
        the local date and re-emitting at each local midnight, with
        `TodayViewModel` keying `uiState` on it through `flatMapLatest`. The
        inner `combine` keeps exactly five typed sources — the date is the key,
        not a sixth input. `ON_RESUME` pushes the current date into the same
        flow for an app backgrounded across midnight.

        `answer()` now reads `uiState.value.date` rather than the date source or
        a fresh clock read, because both can advance between the row being
        rendered and the user tapping it. That was the half that corrupted data
        — an after-midnight answer written against yesterday.

        The tick loop re-reads the clock and recomputes `millisUntilNextMidnight()`
        every iteration instead of adding 24 hours, so a sleeping device ticks
        late but never wrong, and carries a 1-second positive floor because the
        helper clamps to zero at exact midnight.
      resolution_verified: >
        Verified: 196 JVM unit tests, 0 failures, 0 errors; detekt zero findings;
        all three source sets compile; matrix green on both legs 2026-09-03 —
        api31 115 tests / 0 failures / 0 errors / 2 skipped, api37 115 / 0 / 0 /
        1 skipped, the skips complementary by design.

        Not covered, deliberately, and tracked separately as
        `today-foregrounded-timezone-travel`: timezone travel while the app stays
        continuously foregrounded.

    - id: "today-rows-are-built-from-tables-the-screen-does-not-observe"
      title: "TodayViewModel reads each habit's schedule and slots imperatively inside a combine that observes neither table"
      status: open
      severity: >
        Not reachable through any of the app's own write paths today, so this is
        a fragility rather than a live defect. It is recorded because it is the
        exact mechanism behind `today-slot-row-compose-test-timeout-flakiness`
        above, and the fix that closed that item removes the trigger without
        removing this.
      origin: >
        Found on 2026-09-03 while measuring the flake above rather than
        re-running it. Instrumenting the tracking package's bounded waits caught
        one timing out with `TodayViewModel.uiState` still reporting `rows=0`
        fifteen seconds after the habit had been committed — a stall, not
        slowness. A temporary `MechanismProbeTest` then reproduced it
        deterministically on the api31 leg by forcing the interleaving: still
        `rows=0` four seconds after all three writes had committed, against 17 ms
        when the same three writes shared one transaction.
      reason: >
        `TodayViewModel.uiState` combines five sources, three of them Room flows:
        `habitRepository.observeAll()` (`habits`), `entryDao.observeByDate`
        (`entries`) and `reminderOccurrenceDao.observeUnresolved()`
        (`reminder_occurrences`). Inside the combine's transform it then calls
        `habitRepository.findScheduleFor(habit.id)` and `findSlotsFor(habit.id)`
        — one-shot suspend reads of `schedules` and `reminder_slots`. Neither
        table is observed by anything in that combine, and a habit whose schedule
        read returns null is dropped by `mapNotNull`. Room re-runs the transform
        only when one of the three observed tables is invalidated, so a state
        that is wrong with respect to the other two tables stays wrong.
      why_it_matters: >
        It costs nothing today, and the reason is worth writing down because
        nothing enforces it: every production writer of `schedules` or
        `reminder_slots` sits inside a `database.withTransaction` that also
        writes `habits` or `entries` — `HabitRepository.create`, `update`,
        `deleteSlot` (which deletes the slot's entries in the same transaction),
        `delete`, and `BackupImporter.replaceAll`. That is an invariant nobody
        declared and no test guards. The first writer that changes only a slot or
        only a schedule leaves Today showing the previous row until some
        unrelated write happens to refresh it, and it will present the way this
        item's parent did: not as an error, but as a screen that is quietly and
        durably wrong.
      owner_condition: >
        Its own change, and only if a writer that breaks that invariant is
        actually wanted — this is not worth pre-emptively refactoring the screen
        for. Two shapes are worth weighing rather than one being obviously right.
        Observe the two tables as well: Room 2.7's
        `InvalidationTracker.createFlow`, or DAO flows folded into the combine,
        which is already at `combine`'s largest typed overload and would need its
        sources re-bundled. Or replace the per-habit reads with one observed
        relation query returning each habit with its schedule and slots, which
        removes the staleness and the N+1 in the transform together. Whichever is
        chosen, do not close this with a retry, a poll, or a longer wait
        anywhere — that is what the parent item spent two changes learning.

    - id: "today-foregrounded-timezone-travel"
      title: "A continuously foregrounded Today screen does not notice a timezone change on its own"
      status: open
      severity: >
        Narrow: only a device whose timezone changes while the today screen is
        open AND never backgrounded in between. Both ordinary midnight rollover
        and a backgrounded resume are already covered by this change
        (today-midnight-rollover); this is the one path that was deliberately
        left out rather than missed.
      origin: >
        Named and scoped in today-midnight-rollover's spec delta itself (the
        "Foregrounded timezone travel remains a known, accepted gap" scenario
        under habit-entry-tracking: Day-Level Rollup and Per-Slot Display),
        recorded here per this file's own carried-forward policy so the
        boundary is not lost once that change's folder moves under archive/.
      reason: >
        `CurrentDateSource`'s self-rescheduling timer re-anchors on
        `TimeProvider.today()`/`millisUntilNextMidnight()` at every emission, so
        it already absorbs a DST shift or a timezone change on the NEXT
        boundary it computes. What it cannot do is notice a change to the
        ambient zone WHILE it is already asleep inside a `delay()`, because
        that delay's length was computed from the zone at the moment it was
        scheduled. `TodayViewModel.refreshDate()`, called on `ON_RESUME`,
        corrects this on any backgrounding — even a brief one — but a screen
        that is never backgrounded has no trigger to re-read the clock at all.
      why_it_matters: >
        The screen may keep showing the prior date until the user leaves and
        returns, exactly as the spec's own scenario states. This is a
        continuously-foregrounded edge case of an already-narrow trigger
        (changing the device's timezone), not a regression of ordinary
        midnight rollover or of resume-after-backgrounding, both of which this
        change fixes outright.
      owner_condition: >
        A future change that already needs an in-process app-wide time
        signal — a broadcast receiver for `ACTION_TIMEZONE_CHANGED` /
        `ACTION_DATE_CHANGED` wired to something wider than one screen, for
        example. Not worth introducing that surface for this screen alone;
        today-midnight-rollover's design.md deliberately rejected a broadcast
        bridge / event bus for the whole change ("Technical Approach", and the
        Threat Matrix's note that the broadcast/IPC option was rejected).
    - id: "device-locale-resolution-has-no-runtime-test"
      title: "Nothing exercises a Spanish DEVICE locale with no override stored"
      status: open
      severity: >
        Low confidence rather than low risk. The behaviour is Android's own
        resource-qualifier resolution, which is very unlikely to break — but it
        is the path a first-install user actually takes, and it is the only one
        of the nine app-localization requirements with no runtime coverage at
        all.
      origin: >
        Found by app-localization-es-en's verify pass and recorded in its
        verify-report.md as finding 1.
      reason: >
        The device-free emulator matrix runs both legs (API 31, API 37) with an
        English device locale, and `AppLocaleInstrumentedTest` exercises the
        OVERRIDE wrapping path via `localizedContext`. Those are genuinely
        different code paths: one asks Android to resolve `values-es/` from the
        device configuration, the other hands it a Configuration we built
        ourselves. Passing the second says nothing about the first.
      why_it_matters: >
        Requirements "Device-Locale Resolution", "Supported Language Set And
        Universal Fallback" and "First-Install Resolution Needs No User Action"
        all rest on it, and all three describe what happens before the user has
        touched anything.
      owner_condition: >
        Any change that already builds a locale-configured `Context` in an
        instrumented test, or a matrix leg configured with a non-English device
        locale. Closing it needs an assertion that `values-es/` is selected with
        NO stored override — not another test of the override path.
    - id: "system-settings-language-parity-is-one-directional"
      title: "A language change made from Android Settings is never asserted to reach the in-app picker"
      status: open
      severity: >
        API 33+ only, and only the system-to-app direction. The app-to-system
        direction is covered.
      origin: >
        app-localization-es-en verify-report.md, finding 2.
      reason: >
        `AppLocaleController` reads and writes `LocaleManager`, and
        `LanguageOverrideStoreInstrumentedTest` covers that on the 33+ leg. The
        mechanism that makes the reverse direction work is
        `LifecycleStartEffect { refresh() }` in `LanguageSection` — chosen over
        observing a Flow precisely because `LocaleManager` exposes none — and
        nothing exercises it. `LanguageOverrideComposeTest` is API 31/32 only
        by design, since `ProvideAppLocale` is a deliberate pass-through above
        that.
      why_it_matters: >
        The requirement "API 33+ System-Settings Parity, In-App Picker Only
        Below" names both directions. On the maintainer's own device (API 36)
        the system picker is the one a user is most likely to reach for.
      owner_condition: >
        A change that already drives `LocaleManager` from an instrumented test
        AND renders the picker — the two halves exist separately today.
    - id: "cold-process-notification-test-is-not-real-process-death"
      title: "The Spanish cold-process notification test proves 'no Activity created', not process death"
      status: open
      severity: >
        Stated honestly in the test's own KDoc rather than discovered later.
        The gap is between "no Activity ever existed in this process" and "this
        process was killed and restarted by AlarmManager".
      origin: >
        app-localization-es-en verify-report.md finding 3; already flagged in
        design.md's own testing section before the test was written.
      reason: >
        An instrumented test runs inside a live instrumentation process; it
        cannot kill and let AlarmManager resurrect its own host. What
        `SpanishColdProcessNotificationInstrumentedTest` does prove is that
        `NotificationPoster` resolved Spanish from the persisted tag with no
        Activity in the picture, which is the part the mechanism is responsible
        for.
      why_it_matters: >
        This is the headline failure the whole change exists to prevent — a user
        who picked Spanish receiving an English reminder. The remaining
        uncovered slice is the process lifecycle, not the localization logic.
      owner_condition: >
        The same manual `adb` check already listed under
        testing.instrumented.device_free_matrix.limits. Fold it in there rather
        than inventing a second mechanism for this change alone.
    - id: "import-failure-message-mapping-is-untested"
      title: "importFailureMessage's four branches are compiler-checked for completeness, not for correctness"
      status: open
      severity: >
        Four one-line mappings. Low risk, and the cheapest of these four items
        to close.
      origin: >
        app-localization-es-en verify-report.md finding 4; flagged in PR #71's
        own description before merge.
      reason: >
        The `when` over `ImportFailure` in `DataPortabilityScreen` is
        exhaustive, so a new failure case cannot be added without copy in both
        string files. Nothing asserts that each existing branch selects the
        right resource. Covering it means making `ImportResultMessage` and
        `importFailureMessage` `internal` so a Compose test can render them.
      why_it_matters: >
        A Spanish user shown the wrong rejection reason is the exact bug class
        the typed-error refactor was written to eliminate. It would be a poor
        joke for that refactor to introduce it.
      owner_condition: >
        Any change touching data-portability's UI, or a deliberate
        test-coverage pass. Needs two private composables promoted to
        `internal`.
stack:
  status: ratified
  note: >
    Ratified by user decisions plus sdd-design revisions for change
    habit-tracking-mvp (see openspec/changes/archive/2026-09-01-habit-tracking-mvp/design.md,
    now archived). Confirmed built and verified in this repository: at `main`
    9a4c8a4, `./gradlew :domain:test :app:testDebugUnitTest :domain:detektMain
    :app:detektMain :app:connectedDebugAndroidTest --rerun-tasks` exits 0
    (:domain:test 52, :app:testDebugUnitTest 97, :app:connectedDebugAndroidTest
    59 — all 0 failures/errors/skipped; both detekt tasks clean). `still_unpinned`
    was already empty before this archive; nothing here was reopened by
    archiving.

  ratified:
    date: 2026-08-31
    by: user
    items:
      - "minSdk = 31"
      - "compileSdk = 37 (Android 17; released platform, not a preview)"
      - "targetSdk = 37 (deliberate forward step, above the Play floor of 36)"
      - "Exactly two Gradle modules: :domain (pure Kotlin JVM) and :app"
      - "Exact alarms under SCHEDULE_EXACT_ALARM only; never USE_EXACT_ALARM"
      - "Storage local-only forever; manual file export/import; no cloud sync"
      - "Entry states completed/missed/skipped/unknown; skipped is neutral"
      - "Notification actions Yes/No/Snooze; snooze default 20 min, unlimited"

  ratified_by_design:
    date: 2026-08-31
    phase: sdd-design
    items:
      - "DI: Hilt with KSP (:app only; :domain has no DI annotations at all)"
      - "Serialization: kotlinx-serialization-json, in :app only"
      - "Settings storage: DataStore Preferences; Room for domain data only"
      - "Unit test framework: JUnit4 (revises the earlier unratified JUnit5 plan;
         instrumented tests are JUnit4-based regardless, and JUnit5 on Android
         needs an extra third-party Gradle plugin)"
      - "Export/import file format: a single UTF-8 JSON document via SAF"
      - "Week boundary: ISO-8601 Monday start, parameterised, never locale-derived"

  still_unpinned: []
  pinned_by_apply:
    date: 2026-08-31
    phase: sdd-apply (work unit 1)
    items:
      - "Room 2.8.4 and WorkManager 2.11.2 — latest stable releases on Google Maven at
         scaffolding time; both resolve and build successfully in this repository
         (:app depends on room-runtime/room-ktx/room-compiler and work-runtime-ktx)"
      - "Lint / formatter: detekt 1.23.8, applied to :domain only. The custom
         ForbiddenMethodCall rule (config/detekt/detekt.yml) requires TYPE RESOLUTION
         to resolve fully qualified call targets — the plain `detekt` task is PSI-only
         and never fires it. The real enforcement command is `./gradlew detektMain`
         (wired into :domain's `check` task). Verified: the rule fires on
         LocalDate.now()/System.currentTimeMillis()/ZoneId.systemDefault() and is
         clean once those calls are removed."
      - "AGP 9.3.2 / Kotlin 2.4.10 / KSP 2.3.11 / Compose BOM 2026.08.00 / Hilt 2.60.1
         carried from the user's verified sibling project sleep-noise-android; now
         also verified building in THIS repository via assembleDebug. AGP 9 has
         built-in Kotlin support, so org.jetbrains.kotlin.android is not applied to
         :app (only kotlin(\"jvm\") for :domain)."

  sdk:
    minSdk: 31
    compileSdk: 37
    targetSdk: 37
    platform_prerequisite: >
      The android-37.0 platform must be present locally; AGP downloads it on the
      first build. Verified installed on the current machine at
      $ANDROID_HOME/platforms/android-37.0 (ro.build.version.release=17,
      codename=REL, preview_sdk=0, min_supported_target_sdk=28). A fresh clone on
      another machine will trigger the download.
    lint_note: >
      No OldTargetApi suppression is needed or permitted here: targetSdk equals
      compileSdk equals the newest platform.
    open_risk: >
      UNVERIFIED. The targetSdk=37 behaviour-change list was NOT read against
      authoritative Android documentation during sdd-design (no web or context7
      access in that phase). API surface was verified locally against the
      installed android-37.0 platform, but API surface does not encode
      targetSdk-gated behaviour. Alarm quotas, notification limits, foreground
      service restrictions, and background-execution/Doze behaviour at API 37
      remain unverified. Discharging this gate is BLOCKING before Gradle
      scaffolding merges — see design.md section 5.4.

  language: Kotlin
  ui: Jetpack Compose, Material 3
  persistence: Room (local only) for domain data; DataStore Preferences for settings
  scheduling: >
    AlarmManager exact alarms fire the reminders (setExactAndAllowWhileIdle under
    SCHEDULE_EXACT_ALARM, degrading to a >=10 min inexact window when not
    permitted); WorkManager reconciles, sweeps missed reminders, and performs the
    expedited notification-action writes. Notification actions land on a
    validate-only BroadcastReceiver, never a Room write in onReceive().
  di: Hilt (KSP)
  build: Gradle with Kotlin DSL and version catalogs
  architecture: >
    Exactly TWO Gradle modules. :domain applies kotlin("jvm") only and holds the
    habit model, the occurrence-due predicate, the day-level rollup, and the
    streak/compliance calculators as pure synchronous functions; the module type
    itself is the enforcement, because android.* and androidx.* cannot resolve
    there. Time enters :domain as a parameter, never by reading the clock. :app
    holds everything Android and is organised by CAPABILITY packages (habit,
    scheduling, tracking, reminding, progress, portability, core) rather than by
    layer, so the package tree names the product. Clean/Hexagonal boundaries are
    preserved by the module type plus package discipline, not by extra Gradle
    modules. Richer modularisation (:feature-*, :core-ui) is deferred until a
    second build target exists (widget, Wear OS) or build-time pain is measured.
    This REPLACES the earlier full multi-module plan, which was marked
    planned_unratified precisely so sdd-design could revise it.

testing:
  status: verified
  note: >
    Verified in this repository at `main` 9a4c8a4 (archive of habit-tracking-mvp,
    2026-09-01): `./gradlew :domain:test :app:testDebugUnitTest :domain:detektMain
    :app:detektMain :app:connectedDebugAndroidTest --rerun-tasks` exits 0.
    :domain:test 52/52, :app:testDebugUnitTest 97/97, :app:connectedDebugAndroidTest
    59/59, all 0 failures/errors/skipped; both detekt tasks clean. This updates
    the `planned_not_yet_verifiable` status recorded before the first change
    shipped, per config.yaml's own `rules.archive` instruction.
  unit:
    available: true
    command: "./gradlew :domain:test && ./gradlew :app:testDebugUnitTest"
    framework: "JUnit4 + kotlin.test (revises the earlier unratified JUnit5 plan; see design_intent below)"
  instrumented:
    available: true
    command: "./gradlew :app:connectedDebugAndroidTest"
    framework: "AndroidX Test + androidx.work:work-testing + compose-ui-test-junit4 + androidx.test.uiautomator"
    harness: >
      An emulator is the DEFAULT runtime harness for this suite; physical hardware is
      the exception, not the norm. The sanctioned way to run it is the device-free
      matrix below, which provisions its own emulators and needs no AVD to exist on the
      machine and nothing attached. `./gradlew :app:connectedDebugAndroidTest` remains
      available for iterating against an already-running emulator; pass `ANDROID_SERIAL`
      when more than one device is attached. Hand-made AVDs on this machine
      (`Medium_Phone` 411dp, `Tablet7` 600dp — the natural `sw >= 600dp` route, cleaner
      than a `wm density` override, `Tablet10` 800dp, `Constanza_API31`) are for that
      manual route only; Gradle Managed Devices never touches them. Physical hardware is
      required only for what an emulator cannot reproduce: the One UI
      background-throttling row (carried-forward item `G.7-throttling-row`) and a real
      fold/unfold configuration change — a phone AVD reports only the `DEFAULT` device
      state (`adb shell cmd device_state print-states`). `cmdline-tools` IS now installed
      (`$ANDROID_HOME/cmdline-tools/latest/bin/{sdkmanager,avdmanager}`), which supersedes
      the "no avdmanager binary" reason recorded against the `colour-dot-fold-unfold`
      carried-forward item; a foldable AVD is now creatable from the command line.
    device_free_matrix:
      status: ratified
      date: 2026-09-02
      by: user
      convention: >
        The standard develop / test / release cycle MUST be fully verifiable on an
        emulator with nothing plugged in. Granting the notification permission through
        the real system dialog, adding a habit, a reminder notification actually
        arriving, answering from that notification, and removing a habit are all driven
        through the product's own UI and asserted autonomously — see
        `app/src/androidTest/kotlin/com/jjrapps/constanza/e2e/CoreFlowE2ETest.kt`.
        Physical-hardware testing happens only by explicit prior agreement. Do not ask
        for a device as a matter of course, and do not record a check as unverifiable
        merely because nothing is attached.
      command: "./gradlew :app:emulatorMatrixGroupDebugAndroidTest"
      devices: >
        Two, declared in `app/build.gradle.kts` under `testOptions.managedDevices` and
        grouped as `emulatorMatrix`, so the one command above runs the whole matrix.
        `api31` (Pixel 6, SDK 31, `aosp-atd`) is the API 31-32 half of the
        `POST_NOTIFICATIONS` boundary, where the runtime permission does not exist,
        `NotificationPermission.decide` answers `NOT_APPLICABLE`, and the Today banner
        must never render. `api37` (Pixel 6, SDK 37, `google_apis`, 4KB pages) is
        targetSdk, where the permission exists and the real
        `com.android.permissioncontroller` dialog is tapped through UiAutomator. The
        API 37 leg is NOT on an ATD image because Google publishes none at that API
        level; `google_apis` is the lightest image android-37.0 offers. Gradle Managed
        Devices downloads its system images and creates its own AVDs on first run, which
        is slow once and cached afterwards.
      limits: >
        Read this before treating a green matrix as a release gate. A green matrix is
        NOT evidence about the maintainer's Galaxy S25, or about any One UI device. An
        emulator does not reproduce One UI's aggressive background-process killing, its
        "put unused apps to sleep" policy, or real Doze — and those three are exactly
        the conditions under which this app's reminders are most likely to fail in the
        field, because every one of them attacks the alarm-and-worker path the whole
        feature rests on. What the matrix proves is that the product's own logic and
        wiring are correct; it says nothing about whether the OEM will let that wiring
        run. The maintainer has accepted that residual risk knowingly. The
        carried-forward items `G.7-throttling-row` and `colour-dot-fold-unfold` stay
        exactly as open as they were.
    java_home: >
      REQUIRED for every `./gradlew` invocation — this machine has no system JDK and
      Gradle dies with "Unable to locate a Java Runtime" without it. Applies to all
      commands in this section, not only the instrumented one:
      `export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"`
      (OpenJDK 21, bundled with Android Studio).
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "./gradlew :domain:detektMain :app:detektMain"
    formatter:
      available: false
      command: ""

  # Recorded by sdd-design (2026-08-31) for change habit-tracking-mvp. At design time this was
  # DESIGN INTENT ONLY. The `available` flags above are left untouched by sdd-apply work unit 1
  # (still scoped to :app instrumented/lint status, unverified); `strict_tdd` below WAS updated
  # by sdd-apply once `./gradlew :domain:test` was verified green in this repository — see the
  # gate condition this replaces.
  design_intent:
    frameworks:
      unit: "JUnit4 + kotlin.test (revises the earlier unratified JUnit5 plan)"
      mocking: "MockK; Turbine for Flow; kotlinx-coroutines-test"
      instrumented: "AndroidX Test + androidx.work:work-testing + compose-ui-test-junit4"
      migrations: "Room MigrationTestHelper against the checked-in app/schemas/com.jjrapps.constanza.core.data.AppDatabase/1.json"
    commands:
      domain_unit: "./gradlew :domain:test"
      app_unit: "./gradlew :app:testDebugUnitTest"
      instrumented: "./gradlew :app:connectedDebugAndroidTest"
      aggregate: "./gradlew check"
      assemble: "./gradlew assembleDebug"
    strict_tdd_gate: >
      Once ./gradlew :domain:test runs green in THIS repository, enable strict TDD
      SCOPED TO :domain — that module is pure, fast, and dependency-free, and holds
      the logic where a silent error is most expensive. Keep :app non-strict while
      its instrumented suite is still unverified. Do not flip the flag on the basis
      of this recorded intent alone.
    manual_verification_note: >
      Alarm delivery across reboot, timezone change, Doze, OEM throttling, denied
      permissions, and snooze-across-midnight is not automatable and has an adb
      recipe matrix in design.md section 13.3. It MUST be run on an API 37 image.

strict_tdd: true
strict_tdd_scope: ":domain only — :app stays non-strict (its instrumented suite is still unverified)"
strict_tdd_reason: >
  Flipped by sdd-apply (work unit 1, 2026-08-31): `./gradlew :domain:test` was verified green in
  this repository (PlaceholderTest passes; empty-suite acceptance criterion from tasks.md 1.9 is
  satisfied). This discharges the strict_tdd_gate condition recorded above by sdd-design. Strict
  TDD now applies to :domain (pure, fast, dependency-free — the highest-value place for a RED
  test to exist before the GREEN implementation, per design.md §13.2). :app remains non-strict
  until its instrumented suite (Room DAOs, workers, Compose UI tests) is verified in work unit 3+.

rules:
  proposal:
    - Include a rollback plan for any change that touches scheduling/alarms or persisted data
    - State explicitly which parts of the stack above the proposal treats as still unratified
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep the domain module (scheduling/scoring) framework-agnostic in requirement language
  design:
    - Confirm or revise the planned stack in this file's `stack:` section; do not assume it silently
    - Document architecture decisions with rationale, especially module boundaries
    - Include sequence diagrams for reminder/alarm and snooze flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Sequence Gradle/module scaffolding before feature tasks that depend on it
  apply:
    guidelines:
      - Follow Clean/Hexagonal/Screaming Architecture boundaries once scaffolded
      - Keep the domain module free of Android SDK imports
    tdd: true # :domain scope only — see strict_tdd_reason above
    test_command: "./gradlew :domain:test"
  verify:
    test_command: "./gradlew check"
    build_command: "./gradlew assembleDebug"
    device_free_matrix_command: "./gradlew :app:emulatorMatrixGroupDebugAndroidTest"
    device_free_matrix_note: >
      `check` covers unit tests, lint and detekt only — it runs no instrumented test at
      all, so a green `check` says nothing about the reminder path. Run the matrix
      command above for that, and read `testing.instrumented.device_free_matrix.limits`
      before quoting the result as release evidence.
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Update this file's `stack:` and `testing:` status from planned to verified once confirmed
