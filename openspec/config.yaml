# openspec/config.yaml
schema: spec-driven

project: constanza-android

context: |
  Constanza: native Android habit tracker (tracking + reminders only,
  no to-do list, no gamification). Repository is greenfield: no source
  code, no Gradle files, no build system exist yet as of this init.
  Reference apps (Loop Habit Tracker/uhabits GPL-3.0, HabitNow, Habitify,
  Streaks) are reference-only; no code may be copied or derived from them.

carried_forward_open_items:
  note: >
    Genuinely open work items surfaced by a change but deliberately left out of
    its scope. None of these is a stale checkbox or an oversight; each is a
    documented, reasoned block with a named owner condition. This section is the
    durable home for them because a change folder eventually moves under
    archive/, which a future contributor opening a new change is unlikely to
    browse. Do not close any item silently in a future change — resolve it
    explicitly and remove it from this list when done, or replace it with a new
    decision. Item 7.5 was closed this way by warm-dark-design-system, which
    wrote the app's first Room migration and so met its owner condition.
  items:
    - id: "post-notifications-never-requested"
      title: "The app never requests POST_NOTIFICATIONS, so reminders are inert on a fresh API 33+ install"
      status: resolved
      severity: "highest of the open items — it silently disables the app's core feature"
      origin: >
        Found on 2026-09-02 by installing the debug build on the maintainer's own
        Galaxy S25 (SM-S931B, API 36) to try the app. Measured on the device
        immediately after a clean install: `POST_NOTIFICATIONS: granted=false`
        and `AppSettings: com.jjrapps.constanza importance=NONE`. The maintainer
        independently confirmed the behaviour from the other side: the only
        permission prompt they ever saw was the exact-alarm deep link to a system
        settings screen, never the native notification prompt.
      reason: >
        Nothing in the app asks. Verified across all of app/src/main: there is no
        `rememberLauncherForActivityResult(RequestPermission())` anywhere, and no
        Intent to ACTION_APP_NOTIFICATION_SETTINGS either. The only permission
        launchers in the codebase are the SAF document pickers in
        DataPortabilityScreen.kt. So canPost() returns false, NotificationPoster
        correctly declines to post, and no reminder ever arrives — with no
        in-app path out of the denied state.
      not_a_spec_violation: >
        Be precise about this. reminder-response's `Notification Permission
        Scope` requires that delivery be GATED by the permission on API 33+,
        that API 31-32 deliver with no prompt, and that a denial still leave the
        today screen usable for in-app answering. All three are implemented and
        its scenario passes. The spec never required the app to ASK. This is a
        product gap whose promise lives in the code's own KDoc, the same shape as
        the Theme.kt product-palette promise.
      why_it_matters: >
        Eleventh instance of this repository's defining failure mode. The logic
        is already written and unit-tested: NotificationPermission.kt is a
        four-state decision table whose SHOULD_REQUEST state is documented as
        "the contextual moment to request", and
        ReminderSettingsStore.recordRequestedNotificationPermission() exists for
        the same caller. BOTH have zero production consumers — the only
        reference to SHOULD_REQUEST outside its file is its own test. The class
        KDoc names the owner: "the future onboarding/settings UI, work unit
        6a/6b". Units 6a and 6b both shipped without it.
      owner_condition: >
        No blocker. A Today banner symmetric to the existing ExactAlarmBanner,
        which is already the right pattern in this codebase: consult
        NotificationPermission.decide(hasRequestedBefore); on SHOULD_REQUEST
        launch the native POST_NOTIFICATIONS prompt and call
        recordRequestedNotificationPermission() on return; on BLOCKED offer a
        deep link to ACTION_APP_NOTIFICATION_SETTINGS, the same gesture the
        exact-alarm banner uses; on GRANTED or NOT_APPLICABLE render nothing.
      resolution: >
        Shipped exactly as the owner condition describes, on branch
        fix/request-post-notifications. TodayViewModel now injects
        NotificationPermission and ReminderSettingsStore and folds
        NotificationPermission.decide(hasRequestedNotificationPermission()) into
        TodayUiState, re-reading it on ON_RESUME alongside the existing
        exact-alarm re-check. TodayScreen renders a NotificationPermissionBanner
        above the exact-alarm banner (a missing permission outranks a late one)
        for SHOULD_REQUEST and BLOCKED only. SHOULD_REQUEST launches the native
        prompt through rememberLauncherForActivityResult(RequestPermission())
        and calls recordRequestedNotificationPermission() when the dialog
        returns, whatever the user answered — the flag means "we have asked".
        BLOCKED deep-links to ACTION_APP_NOTIFICATION_SETTINGS with
        EXTRA_APP_PACKAGE. GRANTED and NOT_APPLICABLE render nothing.
        NotificationPermission and recordRequestedNotificationPermission() now
        have their first production consumers.
      resolution_caveat: >
        NOT confirmed on real hardware. No device is attached, so the verified
        evidence is JVM-level only: :app:compileDebugKotlin,
        :app:testDebugUnitTest (121 tests, 0 failures, including three new
        TodayViewModelTest cases covering the decision reaching TodayUiState,
        the ON_RESUME re-read, and the record-then-refresh transition from
        SHOULD_REQUEST to BLOCKED), :app:detekt, :app:detektMain and
        :app:lintDebug all pass. What is still unproven is the part that
        originally failed on the device: that the native prompt actually appears
        on a clean install on the Galaxy S25 (API 36) and that granting it
        flips the channel out of importance=NONE. Re-run the original
        measurement — clean install, launch, screenshot, then
        `adb shell dumpsys package com.jjrapps.constanza | rg POST_NOTIFICATIONS`
        and `adb shell dumpsys notification_manager | rg -A3 com.jjrapps.constanza`
        — before treating this as closed on device.
    - id: "habit-editor-has-no-cancel-affordance"
      title: "The habit editor cannot be backed out of; cancelling closes the app"
      status: open
      origin: >
        Found on 2026-09-02 while settling first-run-onboarding's finish
        destination. Verified in source, not inferred.
      reason: >
        `HabitEditorTopBar` (HabitEditorScreen.kt:191-193) is
        `TopAppBar(title = { Text(stringResource(titleRes)) })` with no
        navigation icon. `onDone` fires only from `viewModel.events`
        (HabitEditorScreen.kt:77), which emits after a successful save. And
        `BackHandler` does not appear anywhere in app/src/main, so system back
        falls through to the Activity default and finishes it. There is
        therefore no way to leave the editor without saving except closing the
        app.
      why_it_matters: >
        Tolerable today, because every current route into the editor is one the
        user chose from the habit list. It stops being tolerable the moment
        anything else lands them there. first-run-onboarding scopes a
        BackHandler into its own gate for exactly that reason, which fixes the
        onboarding entry and leaves every other entry point unchanged — so this
        item survives that change rather than being closed by it.
      owner_condition: >
        The same change that resolves `today-has-no-add-habit-affordance`,
        since adding an add-habit affordance to Today creates a second entry
        point into the editor and makes the missing escape reachable by
        ordinary use. Needs a real decision, not just a back arrow: whether an
        editor with unsaved edits should confirm before discarding.
    - id: "today-has-no-add-habit-affordance"
      title: "Today offers no way to add a habit, and reads as broken when it is empty"
      status: open
      origin: >
        Raised by the maintainer on 2026-09-02 while designing onboarding. A
        first-run user finishing onboarding lands on Today with zero habits,
        which is the state the screen handles worst.
      reason: >
        TodayScreen renders only `R.string.today_empty` as a bare Text when
        `state.rows.isEmpty()`, and the sole route to habit creation is the
        "Manage habits" TextButton in the TopAppBar actions, which reads as
        navigation rather than as the primary action. There is no add
        affordance on Today itself in either the empty or the populated state.
      why_it_matters: >
        This is the first screen of the app and, on a clean install, it is
        empty by definition. An empty list with no call to action is
        indistinguishable from a broken screen. It also leaves the onboarding
        flow unfinished: the flow ends by handing the user a screen that does
        not tell them what to do next.
      owner_condition: >
        Its own change, sequenced after onboarding since onboarding is what
        makes the empty state the guaranteed first thing a new user sees. Two
        distinct presentations were requested: a centred "Add habit" action
        when there are no habits, and the same action at the end of the list
        once habits exist. Worth deciding at that point whether the populated
        case is better served by a FAB than by a trailing list item, and
        whether Today's empty state should instead route straight into the
        habit editor.
    - id: "compose-test-db-teardown-race"
      title: "TodayComposeTest's async DB teardown can crash the whole instrumentation process"
      status: open
      severity: "does not fail the build honestly — it misattributes failures to unrelated tests"
      origin: >
        Fired on 2026-09-02 during first-run-onboarding Unit B's second matrix
        run: the entire api31 instrumentation process died inside
        TodayComposeTest/TodayAdaptiveComposeTest while CoreFlowE2ETest had
        already passed 5/5. A third run with no code changes was clean. The
        failure mode is not new — TodayComposeTest.kt:70-77's own KDoc already
        describes it.
      reason: >
        The test builds a real Room database and constructs TodayViewModel by
        bare constructor. Its @After must cancel viewModelScope BEFORE closing
        the database, or an eager `stateIn` collector throws asynchronously
        after teardown. When it does, the throw lands in the shared
        instrumentation process rather than in the test that caused it.
      why_it_matters: >
        The device-free matrix is now the binding verification gate for this
        project. A gate that intermittently reports a failure against a test
        that did not cause it is worse than a gate that fails: it sends the
        next reader to debug the wrong file. This did not affect the change
        that found it, but it will eventually cost somebody an afternoon.
      owner_condition: >
        Its own small change. The fix is structural rather than a longer
        timeout: make teardown deterministic so the collector cannot outlive
        the database. Worth auditing every instrumented test that constructs a
        ViewModel by bare constructor, not just these two.
    - id: "no-launcher-icon"
      title: "The app ships with the stock Android launcher icon"
      status: resolved
      origin: >
        Seen on the S25 on 2026-09-02: the app appeared with the generic
        Android robot in the launcher and in system settings.
      reason: >
        AndroidManifest.xml declared
        `android:icon="@android:drawable/sym_def_app_icon"` and no mipmap
        resources existed anywhere in app/src/main/res.
      why_it_matters: >
        Not cosmetic once there is a design system. The warm-dark identity has
        a defined accent and palette, and the launcher icon is the one place a
        habit app is seen every day without being opened.
      resolution: >
        Adaptive icon shipped: drawable/ic_launcher_foreground.xml,
        drawable/ic_launcher_monochrome.xml, values/ic_launcher_background.xml
        and mipmap-anydpi/{ic_launcher,ic_launcher_round}.xml, with the manifest
        pointing at both icon and roundIcon. The mark is "Espiral" — one
        unbroken stroke coiling inward — chosen by the maintainer from five
        directions, in ACCENT_ARGB over BACKGROUND_ARGB.

        No raster anywhere and no density buckets: minSdk is 31, well above the
        26 that adaptive icons need, so legacy PNG fallbacks would be dead
        weight. The folder is `mipmap-anydpi`, not `-v26`; the version
        qualifier is redundant at this minSdk and lint's ObsoleteSdkInt was
        right to say so.
      resolution_lesson: >
        The first attempt shipped a broken drawing and it is worth recording
        why, because the failure was invisible in the source. The coil's radii
        stepped by 3 per half-turn, putting adjacent turns 6 apart, under a
        stroke of 9 that reaches 4.5 either side of its centreline — so
        consecutive turns overlapped by 3 and welded into a solid disc with a
        notch. It read as a coffee bean at every size, not just small ones.
        The rule the drawables now carry in comments: stroke must stay below
        the pitch. The corrected coil steps by 6.5 (pitch 13) under a stroke of
        8, leaving a clean 5-wide gap, and drops from two and a half turns to
        two, because a stroke that heavy cannot fit more inside the 66dp safe
        circle.

        The wider lesson is about verification, not geometry: the artwork was
        authored in SVG at large size and signed off there. Nothing catches
        this but rasterising it and looking.
      verified: >
        Built and installed on the API 37 emulator, app drawer screenshotted
        and read: the coil is legible as a spiral, centred, unclipped by the
        launcher mask. lint reports no icon findings — IconMissingDensityFolder,
        IconLauncherShape and MonochromeLauncherIcon are all silent and
        legitimately so, with no lint.xml or baseline suppressing anything.
        Unit tests green.
      not_verified: >
        The themed/monochrome layer was exercised on the emulator by the first
        attempt (Wallpaper & style, Icons, Minimal) and rendered system-tinted,
        but that check has not been repeated against the corrected geometry.
        The icon has not been seen on the physical Galaxy S25.
    - id: "release-build-never-produced"
      title: "No release build has ever been assembled, and the R8 path is unexercised"
      status: resolved
      origin: "Found on 2026-09-02 while choosing a build type to install for hands-on testing."
      reason: >
        app/build.gradle.kts has no `signingConfigs` block, so a release APK
        would be unsigned and uninstallable. Separately, the `release` build type
        sets `isMinifyEnabled = true` and `isShrinkResources = true`, and that
        configuration has never been built even once.
      why_it_matters: >
        R8 over Room, Hilt and kotlinx-serialization is exactly where
        reflection-adjacent breakage hides, and none of it would be caught by
        any current gate: `check` runs unit tests, lint and detekt on debug
        sources only. Every test number this project has ever reported is from a
        debug build. The first release build is therefore an unknown, and it sits
        between here and any distribution.
      owner_condition: >
        Its own PR: add a signing config (a local keystore kept out of the repo),
        assemble release, install it, and run the instrumented suite against the
        minified build. Expect proguard rules to be needed.
      resolution: >
        Done on 2026-09-02. The project's first release build exists and has been
        exercised, not merely compiled.

        WHAT THE SIGNING CONFIG NEEDED. A top-level `Properties()` in
        app/build.gradle.kts loaded from `rootProject.file("keystore.properties")`
        behind an `if (file.exists())` guard, a `signingConfigs` block that only
        calls `create("release")` when `storeFile` is actually present, and
        `signingConfig = signingConfigs.findByName("release")` inside
        `buildTypes.release`. Both guards are load-bearing rather than defensive:
        the keystore and its properties file are gitignored, so without them a
        fresh clone would fail at CONFIGURATION time and could not even build
        debug. The guard was not assumed to work — keystore.properties was
        temporarily moved aside and both variants rebuilt: debug succeeds, and
        assembleRelease also succeeds but emits `app-release-unsigned.apk`
        instead of `app-release.apk`, so the secret is only ever needed to
        produce something installable. Mirrors the pattern already proven in the
        sibling sleep-noise-android project.
        isMinifyEnabled/isShrinkResources were left exactly as they were.

        WHICH PROGUARD RULES WERE NEEDED: NONE. This is the headline finding and
        it contradicts the owner_condition's own expectation above, so it was
        checked three separate ways rather than inferred from a green build.
        `:app:assembleRelease` succeeded on the very first attempt with an empty
        rules file. The release DEX was then inspected directly and every
        reflection-adjacent symbol this app depends on survives: Room's
        `AppDatabase_Impl` is present unobfuscated (androidx.room's own consumer
        rule keeps it), HiltWorkerFactory's five worker class-name map keys
        survive as string literals with the worker classes unobfuscated,
        manifest-declared components are kept by the AAPT-generated rules, and
        kotlinx-serialization needs nothing because every call site passes an
        explicit `BackupFile.serializer()` instead of the reflective
        `serializer(typeOf<T>())` path. Two rules commonly added by reflex were
        tested and rejected: `-keepattributes SourceFile,LineNumberTable` is
        redundant because R8 8.x already writes sourceFile records and line
        mappings into mapping.txt (proven by feeding an obfuscated frame to
        cmdline-tools retrace, which recovered
        `BackupImporter.insertHabit(BackupImporter.kt:113)` exactly), and a
        blanket `-keep class com.jjrapps.constanza.** { *; }` would defeat the
        shrinking this build type exists for. app/proguard-rules.pro now records
        that evidence in place of its former speculative note, so the next reader
        does not add a defensive blob on a hunch.

        SIGNATURE VERIFIED. `apksigner verify --print-certs` (build-tools 37.0.0)
        reports one signer, `CN=Constanza, OU=jjrapps, O=jjrapps, L=Unknown,
        ST=Unknown, C=ES`, RSA 4096, certificate SHA-256
        59659af67e6ae8dd806e7cc9fe4ff575f3bd0e8237adfb971735323e64c912d0.
        Schemes present: v2 only. v1 is off because minSdk is 31, and v3 is off
        because that is the AGP default — worth knowing before key rotation is
        ever wanted, though Play App Signing makes it moot for store delivery.

        SIZE. Release 3,059,614 bytes (2.9 MiB) against debug 36,489,028 bytes
        (35 MiB), both freshly assembled from the same tree. R8 and resource
        shrinking are doing real work.

        RUNTIME VERIFICATION, AND EXACTLY WHERE. The signed release APK was
        installed on the running API 37 emulator (emulator-5554,
        sdk_gphone16k_arm64) and driven by hand through: cold launch, the
        onboarding welcome and notification-permission steps including the real
        POST_NOTIFICATIONS system dialog, creating and saving a habit, answering
        it Yes on Today, the Progress screen computing streak and compliance, a
        backup export written through the SAF picker and read back off the device
        as correct JSON with correct field names, and a backup import replacing
        all data. The reflective worker chain was exercised for real rather than
        simulated: a habit was given a reminder two minutes out, the RTC_WAKEUP
        alarm fired into `.scheduling.ReminderFireReceiver`, WorkManager logged
        `Worker result SUCCESS` for ReminderFireWorker, the notification posted on
        the `reminders` channel with its three actions and accent colour, and
        tapping its Yes action dispatched through ActionReceiver into AnswerWorker
        (also SUCCESS) whose Room write then showed up on Today as
        "14:15 — COMPLETED". Zero FATAL/AndroidRuntime entries in logcat across
        the whole session and zero dropbox crash entries.

        CAVEATS — WHAT WAS NOT VERIFIED. (1) The instrumented suite was NOT run
        against the minified build, so the owner_condition above is only partly
        met. Doing that needs `testBuildType = "release"`, and a minified
        androidTest variant would in turn need keep rules for the test classes
        themselves — a defensive blob whose only purpose is to make the tests
        link, which would obscure exactly the signal this item was opened to get.
        The hand-driven exercise above was chosen instead, deliberately. The debug
        matrix still passes unchanged. (2) The five boot/time/package reschedule
        receivers could not be triggered: their intents are protected system
        broadcasts that adb cannot send, so BootReceiver, PackageReplacedReceiver,
        TimeChangeReceiver and ExactAlarmPermissionReceiver are unproven under
        R8 — they are structurally identical to ReminderFireReceiver and
        ActionReceiver, which both work, but that is an inference and not a
        measurement. (3) MidnightSweepWorker and ReconcileWorker never actually
        ran; WorkManager refuses to execute periodic work ahead of schedule, so
        only their enqueue was observed. (4) Nothing was verified on physical
        hardware and nothing was installed on the maintainer's phone. (5) Room
        has no migrations yet, so the migration path under R8 is untested by
        construction.
    - id: "exact-alarm-banner-false-positive-question"
      title: "Unresolved: did the exact-alarm banner show on a device where the permission is allowed?"
      status: resolved
      severity: "unverified — an open question, not a confirmed defect"
      origin: >
        On 2026-09-02 the maintainer reported seeing a button in the app that led
        to an OS settings screen, on a device where
        `cmd appops get com.jjrapps.constanza SCHEDULE_EXACT_ALARM` reports
        `allow`. TodayScreen renders the banner only under
        `if (!state.canScheduleExactAlarms)`, and TodayUiState defaults that
        field to `true`, so neither the granted state nor the pre-emission
        default should have shown it.
      reason: >
        The evidence is ambiguous and the ambiguity is self-inflicted: a blind
        `adb shell input tap` during exploration navigated the device into the
        exact-alarm settings screen at around the same time, so it cannot now be
        told apart from a banner tap. Do not record this as a bug on that basis.
      why_it_matters: >
        If the banner really does show while exact alarms are allowed, it tells
        every user their reminders may be late when they will not be — and on One
        UI, AlarmManager.canScheduleExactAlarms() diverging from the appop would
        be worth knowing about in its own right.
      owner_condition: >
        Cheap to settle: install clean on a device with the appop allowed, launch,
        screenshot before touching anything, and read whether the banner is
        present. Do not blind-tap on someone's daily device.
      resolution: >
        Not a defect. Settled by the maintainer from their own side rather than
        by a new measurement: the only prompt they ever saw was "a button in the
        app leading to an OS settings screen", which is precisely ExactAlarmBanner
        behaving as designed on a device where SCHEDULE_EXACT_ALARM was still
        denied. The `cmd appops get com.jjrapps.constanza SCHEDULE_EXACT_ALARM`
        reading of `allow` was taken AFTER they had granted the permission
        through that very banner, so the reading and the banner describe two
        different moments in time and never actually contradicted each other.
        There is nothing left to reproduce: TodayScreen's
        `if (!state.canScheduleExactAlarms)` gate and TodayUiState's `true`
        default are correct as written.
      process_note_preserved: >
        The reason this stayed open as long as it did is worth keeping. A blind
        `adb shell input tap` during exploration navigated the device into the
        exact-alarm settings screen at about the same time, which made the
        evidence unreadable and turned a non-event into an open question. Do not
        blind-tap on someone's daily driver; take a screenshot and read it first.
    - id: "colour-dot-fold-unfold"
      title: "Habit colour dot across a real fold/unfold configuration change"
      status: blocked
      origin: >
        The one sub-item of warm-dark-design-system task 6.5 that could not be
        closed. Its other two halves ARE closed and automated: the notification
        accent by NotificationPosterInstrumentedTest, and rendering at
        sw >= 600dp during that change's verification. Promoted out of the
        archived tasks.md deliberately — an unchecked box inside
        openspec/changes/archive/ is invisible to anyone opening a new change,
        which is the whole reason this section exists.
      reason: >
        A fold/unfold is a configuration change no phone can produce. The
        emulator can host it in principle: the pixel_fold, pixel_9_pro_fold and
        pixel_10_pro_fold skins are installed and sdklib.jar carries the
        pixel_fold definition with a foldable-region, but the cmdline-tools SDK
        package is NOT installed, so there is no avdmanager to create the AVD
        from the command line. It has to go through Android Studio's Device
        Manager, or cmdline-tools has to be installed first. A phone AVD reports
        only DEFAULT to `adb shell cmd device_state print-states`.
      why_it_matters: >
        habit-tracking-mvp already discharged a fold/unfold on the real Fold 7,
        but for the habit EDITOR, not the colour dot, so it does not transfer.
        The dot sits in a ListItem leadingContent slot chosen precisely because
        it does not change a row's measured height — the property that keeps
        ui-adaptive-layout's sw >= 600dp no-overlap assertion passing. A
        fold/unfold is the configuration change most likely to disturb that.
      owner_condition: >
        Either install cmdline-tools and create a foldable AVD, or attach a
        foldable. Note the Galaxy S25 (SM-S931B) seen on this machine is NOT a
        foldable and reports only DEFAULT.
    - id: "G.7-throttling-row"
      title: "One UI \"put unused apps to sleep\" survival row (Galaxy Z Fold 7)"
      status: blocked
      origin: >
        habit-tracking-mvp tasks.md task G.7 itself is marked complete ([x]);
        this is one row inside that task's device matrix that is explicitly
        recorded as NOT RUN, not a task-level gap. See
        openspec/changes/archive/2026-09-01-habit-tracking-mvp/design.md
        §13.6 (table row "One UI \"put unused apps to sleep\" survival").
      reason: >
        The Galaxy Z Fold 7 (SM-F966B, Android 16/API 36) became available and
        discharged every other Fold row on 2026-09-01 (large screen, habit
        editor, orientation, fold/unfold as a configuration change — all
        PASS), but this specific row needs a multi-day idle window the
        available device time did not cover.
      why_it_matters: >
        This is the assertion the WorkManager missed-reminder sweep exists to
        satisfy: that a reminder still delivers even if the OEM's aggressive
        background-kill policy throttles the app. Design.md §13.3 states no
        Pixel can make this assertion — it requires this specific device
        class and a multi-day observation window.
      owner_condition: "Resolve when the Fold 7 (or an equivalent One-UI device) is available for an unattended multi-day idle window."
    - id: "notification-permission-blocked-after-one-ask"
      title: "Constanza flips to BLOCKED after one denial, spending the user's second native prompt early"
      status: open
      origin: >
        Recorded on 2026-09-02 by first-run-onboarding's design.md §2.3, while designing the
        onboarding permission screen. This conservatism predates that change;
        first-run-onboarding is what makes it the common path rather than a rare one, since every
        install now reaches the permission ask through onboarding.
      reason: >
        `NotificationPermission.decide` treats any prior ask as permanent: it cannot tell "the
        user was asked once and denied" apart from "the system has permanently blocked further
        prompts", because that distinction needs `shouldShowRequestPermissionRationale`, which
        needs an `Activity` reference the class deliberately does not hold (see its own KDoc).
        `ReminderSettingsStore.hasRequestedNotificationPermission()` is a single boolean latch, set
        the first time the dialog is shown, whatever the answer. So a user who denies once during
        onboarding immediately loses the second native prompt Android would still have shown them,
        and is routed to system settings instead.
      why_it_matters: >
        The error direction fails safe — the approximation can only ever under-prompt, never
        over-prompt, and `BLOCKED` always offers `ACTION_APP_NOTIFICATION_SETTINGS` as a working
        way out, never a dead end. But it does cost a real user a real extra tap through system
        settings where the platform would otherwise have shown a second in-app dialog, and
        first-run-onboarding made that cost visible on every fresh install rather than hidden
        behind a Today banner most users never tapped.
      owner_condition: >
        Any future change that is already touching `NotificationPermission`'s Activity-free
        contract. Fixing it standalone means giving the decision table an `Activity` reference (or
        an equivalent capability) it deliberately does not have today, which is a bigger change
        than the gap it closes; it is cheap only when a change that already needs that reference
        lands anyway.

    - id: "no-shared-time-of-day-formatter"
      title: "The app never honours the device's 12/24-hour setting; every screen hardcodes 24-hour"
      status: open
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, which was auditing the habit editor for
        WCAG 1.4.11 non-text contrast and read the reminder-time code paths on the way through.
        The gap predates that change and is untouched by it.
      reason: >
        There is no one place that renders a time, so there is nothing to teach. `TodayScreen`
        holds a hardcoded `HH:mm` `TIME_FORMATTER` and, separately, its own `"%02d:%02d"` literal
        in `slotStatusText`; the habit editor's reminder rows format their own. None consults
        `android.text.format.DateFormat.is24HourFormat(context)`, so a user whose device is set to
        12-hour sees `21:15` everywhere regardless.
      why_it_matters: >
        It is a locale-correctness gap rather than a defect: the times shown are accurate, just
        not in the notation the user chose system-wide. It is listed because the natural fix is
        cheap and structural — one shared `formatTimeOfDay(minuteOfDay, is24Hour)` that every call
        site reads — and because the duplication that makes it a gap will otherwise keep growing:
        the same literal already exists twice in `TodayScreen` alone, and the unmerged time-picker
        work adds a third copy whose KDoc explicitly notes it is matching `slotStatusText`
        "character for character" precisely because no shared helper exists.
      owner_condition: >
        No blocker, but it must be done app-wide in one change or not at all. Converting a single
        screen would put `9:15 PM` in the editor and `21:15` on Today for the same slot, which is
        worse than one consistent convention. Any change already touching how times are rendered
        on more than one screen should absorb it.

    - id: "fab-and-selected-chip-fills-below-the-non-text-floor"
      title: "Two filled controls identify themselves by a 1.17:1 fill; only their content carries them"
      status: open
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, which fixed every *stroked* control's
        WCAG 1.4.11 contrast and measured, but deliberately did not change, the *filled* ones.
      reason: >
        `FloatingActionButton` fills with `primaryContainer` and the selected `FilterChip` fills
        with `secondaryContainer`; both are `ConstanzaColors.SurfaceSelected`, which measures
        1.17:1 against `Background` — below SC 1.4.11's 3:1. Raising either is not a tuning
        exercise: 3:1 against `Background` needs relative luminance >= 0.111, and the whole surface
        ramp tops out at 0.0092, so any conforming fill is a light slab rather than a surface tone.
      why_it_matters: >
        Both controls remain identifiable, which is why this is an open item and not a defect:
        SC 1.4.11 is satisfied by any boundary that identifies the component, and the FAB has
        Material's own elevation shadow plus (after this change) an accent `+`, while the selected
        chip gained an accent stroke. What is missing is a fill that carries them on its own. Note
        the FAB's glyph is now `onPrimaryContainer` = `Accent`, so it reads 8.11:1 against its own
        container rather than the 13.98:1 the old off-white gave — still far above any floor, and
        traded deliberately for marking the app's primary action in the accent.
      owner_condition: >
        Any change that revisits the surface ramp itself, or one that decides the FAB should be a
        filled accent button (`primaryContainer` = `Accent`, `onPrimaryContainer` = `OnAccent`).
        That second option was considered and rejected here only because it would also turn M3's
        time-picker selected-hour box into a solid amber block, which the unmerged time-picker
        work had already judged too loud on a real screenshot — an argument that stops applying
        the moment that work ratifies a different look.

    - id: "control-stroke-overrides-are-not-guarded-by-a-test"
      title: "Three call sites must opt into ConstanzaControlDefaults, and nothing fails if a fourth forgets"
      status: resolved
      origin: >
        Recorded on 2026-09-02 by fix/control-contrast, as a known limit of the guard that change
        introduced rather than a discovery about existing code.
      reason: >
        material3 1.4.0 routes `OutlinedButton` and unselected `FilterChip` borders through
        `outlineVariant`, the decorative-divider role, alongside `HorizontalDivider`. One token
        cannot clear the 3:1 floor and stay a hairline, so those controls take their stroke from
        `ConstanzaControlDefaults` by hand. `ColorContrastTest` asserts the tones and the role
        bindings — it reads the real `ColorScheme`, so it catches a rebinding — but it cannot see
        a call site that never calls in.
      why_it_matters: >
        The failure is silent and looks exactly like the defect this change fixed: a new
        `OutlinedButton`, `AssistChip`, `InputChip`, `SuggestionChip`, `OutlinedCard` or
        `OutlinedIconButton` added later will take M3's default border and be invisible, with a
        green test suite. The same applies to any future `HorizontalDivider`, in reverse: it will
        correctly get the quiet tone, which is right, but nothing states that intent at the call
        site.
      owner_condition: >
        A lint rule or a detekt `ForbiddenMethodCall` on `ButtonDefaults.outlinedButtonBorder` and
        `FilterChipDefaults.filterChipBorder` would close it mechanically and is the cheapest real
        guard. Worth doing when a fourth such control appears, which is the point at which the
        convention stops being memorable from the three existing examples.
      resolution: >
        Closed on 2026-09-02 by test/guard-control-strokes with two guards, because the suggested
        one turned out to close only half of it.

        Guard 1, the detekt ban the owner_condition named, in `config/detekt/detekt.yml`:
        `ForbiddenMethodCall` now forbids eight Material default border factories —
        `ButtonDefaults.outlinedButtonBorder`, `FilterChipDefaults.filterChipBorder`,
        `AssistChipDefaults.assistChipBorder`, `SuggestionChipDefaults.suggestionChipBorder`,
        `InputChipDefaults.inputChipBorder`, `CardDefaults.outlinedCardBorder`,
        `IconButtonDefaults.outlinedIconButtonBorder` and
        `IconButtonDefaults.outlinedIconToggleButtonBorder`. Each carries a reason naming the token
        it resolves to. The eight were chosen by reading the resolved tokens in
        `material3-android-1.4.0-sources.jar` rather than by pattern-matching on names: every one
        resolves to `ColorSchemeKeyTokens.OutlineVariant`. `OutlinedTextField` is deliberately not
        banned, because `OutlinedTextFieldTokens.OutlineColor` resolves to `Outline`, the
        control-stroke role, so its default is already correct here. `ControlDefaults.kt` is the
        single exempted adapter, the same shape as `TimeProvider.kt` for the clock ban.

        Guard 2, `ControlStrokeCallSiteTest`, which exists because guard 1 alone does not close the
        item. The reported defect is a control added with NO border argument, and such a call site
        calls nothing forbidden — the default is evaluated inside material3, so no banned name
        appears in our source at all. Probed on exactly that: `OutlinedButton(onClick = {}) { Text(…) }`
        planted in `core/ui/theme/` passes `:app:detektMain` cleanly. The test therefore asserts the
        other direction, over `app/src/main/kotlin` as text: every call to any of eight guarded
        composables must pass `border = ConstanzaControlDefaults.…`. It covers the three existing
        call sites by construction, so an edit that strips the argument back off one of them fails
        too, and it asserts its own reach (file count and a floor on call sites found) so a scan
        that reads nothing cannot pass.
      resolution_enabler: >
        The detekt half needed a build fix first, and it retires a "KNOWN GAP" that
        `app/build.gradle.kts` had recorded as an unfixable AGP 9 limitation. That comment said
        `ForbiddenMethodCall` cannot fire in `:app` because the hand-rolled `detektMain` task
        obtains no type resolution under AGP 9. The observation was right and the diagnosis was
        wrong: the task's classpath was unreadable. `debugCompileClasspath` resolves to what the
        dependency graph holds, which for an Android app is mostly `.aar` files — measured at 70 of
        92 entries — and the Kotlin frontend cannot read an `.aar`. `android.jar` was missing
        entirely. Requesting the `android-classes-jar` artifact view and adding
        `androidComponents.sdkComponents.bootClasspath` fixes both, and semantic rules now resolve
        Compose and AndroidX symbols. That is also why the old probe was so convincing:
        `java.time.LocalDate.now()` needs no classpath entry, so the one symbol anybody thought to
        plant was the one symbol that resolved either way.

        Turning resolution on surfaced exactly one finding in existing code: `InjectDispatcher` on
        `replanAsync`, the shared `goAsync()` helper behind five BroadcastReceivers. It is a
        top-level private function with nowhere to inject, so it is excluded by file in the detekt
        config with that reason stated, rather than the rule being switched off.

        The side effect is that the clock ban is now genuinely enforced in `:app` instead of resting
        on the TimeProvider convention and review, which is what the old comment said it rested on.
      verified: >
        Every claim above was probed in both directions rather than reasoned about.

        Guard 1 fires: `border = ButtonDefaults.outlinedButtonBorder(enabled = true)` planted in
        `core/ui/theme/GuardProbe.kt` fails `:app:detektMain` with
        "The method `androidx.compose.material3.ButtonDefaults.outlinedButtonBorder` has been
        forbidden". Removed, the task passes.

        Guard 1's blind spot is real: `OutlinedButton(onClick = {}) { Text("probe") }`, with no
        border argument, passes `:app:detektMain` — BUILD SUCCESSFUL. That is the planted defect
        this item was filed about.

        Guard 2 fires on that same snippet: `ControlStrokeCallSiteTest` fails with
        "GuardProbe.kt:10 OutlinedButton(…)". It also fires on a border sourced from Material
        (before that half was handed to detekt), on a correct border nested inside a content lambda
        of an otherwise-unguarded control, and — the regression direction — on deleting
        `border = ConstanzaControlDefaults.filterChipBorder(selected = isSelected)` from the
        existing `ScheduleEditors.kt:232` chip, which failed with exactly that line.

        The classpath fix was probed by subtraction: with the artifact view and the platform in
        place, `ForbiddenMethodCall` fires on both `java.time.LocalDate.now()` and the real
        `ButtonDefaults.outlinedButtonBorder` call in `ControlDefaults.kt:62`; with the artifact
        view removed, the compose entry stops firing while `java.time` keeps firing; before either
        change, neither fired.

        Suite, all with no probe in the tree: `:app:detekt`, `:app:detektMain`, `:domain:detekt`,
        `:domain:detektMain`, `:app:lintDebug` all BUILD SUCCESSFUL; `:app:testDebugUnitTest` 157
        tests, 0 failures (155 before the 2 added here); `:domain:test` 52 tests, 0 failures.

stack:
  status: ratified
  note: >
    Ratified by user decisions plus sdd-design revisions for change
    habit-tracking-mvp (see openspec/changes/archive/2026-09-01-habit-tracking-mvp/design.md,
    now archived). Confirmed built and verified in this repository: at `main`
    9a4c8a4, `./gradlew :domain:test :app:testDebugUnitTest :domain:detektMain
    :app:detektMain :app:connectedDebugAndroidTest --rerun-tasks` exits 0
    (:domain:test 52, :app:testDebugUnitTest 97, :app:connectedDebugAndroidTest
    59 — all 0 failures/errors/skipped; both detekt tasks clean). `still_unpinned`
    was already empty before this archive; nothing here was reopened by
    archiving.

  ratified:
    date: 2026-08-31
    by: user
    items:
      - "minSdk = 31"
      - "compileSdk = 37 (Android 17; released platform, not a preview)"
      - "targetSdk = 37 (deliberate forward step, above the Play floor of 36)"
      - "Exactly two Gradle modules: :domain (pure Kotlin JVM) and :app"
      - "Exact alarms under SCHEDULE_EXACT_ALARM only; never USE_EXACT_ALARM"
      - "Storage local-only forever; manual file export/import; no cloud sync"
      - "Entry states completed/missed/skipped/unknown; skipped is neutral"
      - "Notification actions Yes/No/Snooze; snooze default 20 min, unlimited"

  ratified_by_design:
    date: 2026-08-31
    phase: sdd-design
    items:
      - "DI: Hilt with KSP (:app only; :domain has no DI annotations at all)"
      - "Serialization: kotlinx-serialization-json, in :app only"
      - "Settings storage: DataStore Preferences; Room for domain data only"
      - "Unit test framework: JUnit4 (revises the earlier unratified JUnit5 plan;
         instrumented tests are JUnit4-based regardless, and JUnit5 on Android
         needs an extra third-party Gradle plugin)"
      - "Export/import file format: a single UTF-8 JSON document via SAF"
      - "Week boundary: ISO-8601 Monday start, parameterised, never locale-derived"

  still_unpinned: []
  pinned_by_apply:
    date: 2026-08-31
    phase: sdd-apply (work unit 1)
    items:
      - "Room 2.8.4 and WorkManager 2.11.2 — latest stable releases on Google Maven at
         scaffolding time; both resolve and build successfully in this repository
         (:app depends on room-runtime/room-ktx/room-compiler and work-runtime-ktx)"
      - "Lint / formatter: detekt 1.23.8, applied to :domain only. The custom
         ForbiddenMethodCall rule (config/detekt/detekt.yml) requires TYPE RESOLUTION
         to resolve fully qualified call targets — the plain `detekt` task is PSI-only
         and never fires it. The real enforcement command is `./gradlew detektMain`
         (wired into :domain's `check` task). Verified: the rule fires on
         LocalDate.now()/System.currentTimeMillis()/ZoneId.systemDefault() and is
         clean once those calls are removed."
      - "AGP 9.3.2 / Kotlin 2.4.10 / KSP 2.3.11 / Compose BOM 2026.08.00 / Hilt 2.60.1
         carried from the user's verified sibling project sleep-noise-android; now
         also verified building in THIS repository via assembleDebug. AGP 9 has
         built-in Kotlin support, so org.jetbrains.kotlin.android is not applied to
         :app (only kotlin(\"jvm\") for :domain)."

  sdk:
    minSdk: 31
    compileSdk: 37
    targetSdk: 37
    platform_prerequisite: >
      The android-37.0 platform must be present locally; AGP downloads it on the
      first build. Verified installed on the current machine at
      $ANDROID_HOME/platforms/android-37.0 (ro.build.version.release=17,
      codename=REL, preview_sdk=0, min_supported_target_sdk=28). A fresh clone on
      another machine will trigger the download.
    lint_note: >
      No OldTargetApi suppression is needed or permitted here: targetSdk equals
      compileSdk equals the newest platform.
    open_risk: >
      UNVERIFIED. The targetSdk=37 behaviour-change list was NOT read against
      authoritative Android documentation during sdd-design (no web or context7
      access in that phase). API surface was verified locally against the
      installed android-37.0 platform, but API surface does not encode
      targetSdk-gated behaviour. Alarm quotas, notification limits, foreground
      service restrictions, and background-execution/Doze behaviour at API 37
      remain unverified. Discharging this gate is BLOCKING before Gradle
      scaffolding merges — see design.md section 5.4.

  language: Kotlin
  ui: Jetpack Compose, Material 3
  persistence: Room (local only) for domain data; DataStore Preferences for settings
  scheduling: >
    AlarmManager exact alarms fire the reminders (setExactAndAllowWhileIdle under
    SCHEDULE_EXACT_ALARM, degrading to a >=10 min inexact window when not
    permitted); WorkManager reconciles, sweeps missed reminders, and performs the
    expedited notification-action writes. Notification actions land on a
    validate-only BroadcastReceiver, never a Room write in onReceive().
  di: Hilt (KSP)
  build: Gradle with Kotlin DSL and version catalogs
  architecture: >
    Exactly TWO Gradle modules. :domain applies kotlin("jvm") only and holds the
    habit model, the occurrence-due predicate, the day-level rollup, and the
    streak/compliance calculators as pure synchronous functions; the module type
    itself is the enforcement, because android.* and androidx.* cannot resolve
    there. Time enters :domain as a parameter, never by reading the clock. :app
    holds everything Android and is organised by CAPABILITY packages (habit,
    scheduling, tracking, reminding, progress, portability, core) rather than by
    layer, so the package tree names the product. Clean/Hexagonal boundaries are
    preserved by the module type plus package discipline, not by extra Gradle
    modules. Richer modularisation (:feature-*, :core-ui) is deferred until a
    second build target exists (widget, Wear OS) or build-time pain is measured.
    This REPLACES the earlier full multi-module plan, which was marked
    planned_unratified precisely so sdd-design could revise it.

testing:
  status: verified
  note: >
    Verified in this repository at `main` 9a4c8a4 (archive of habit-tracking-mvp,
    2026-09-01): `./gradlew :domain:test :app:testDebugUnitTest :domain:detektMain
    :app:detektMain :app:connectedDebugAndroidTest --rerun-tasks` exits 0.
    :domain:test 52/52, :app:testDebugUnitTest 97/97, :app:connectedDebugAndroidTest
    59/59, all 0 failures/errors/skipped; both detekt tasks clean. This updates
    the `planned_not_yet_verifiable` status recorded before the first change
    shipped, per config.yaml's own `rules.archive` instruction.
  unit:
    available: true
    command: "./gradlew :domain:test && ./gradlew :app:testDebugUnitTest"
    framework: "JUnit4 + kotlin.test (revises the earlier unratified JUnit5 plan; see design_intent below)"
  instrumented:
    available: true
    command: "./gradlew :app:connectedDebugAndroidTest"
    framework: "AndroidX Test + androidx.work:work-testing + compose-ui-test-junit4 + androidx.test.uiautomator"
    harness: >
      An emulator is the DEFAULT runtime harness for this suite; physical hardware is
      the exception, not the norm. The sanctioned way to run it is the device-free
      matrix below, which provisions its own emulators and needs no AVD to exist on the
      machine and nothing attached. `./gradlew :app:connectedDebugAndroidTest` remains
      available for iterating against an already-running emulator; pass `ANDROID_SERIAL`
      when more than one device is attached. Hand-made AVDs on this machine
      (`Medium_Phone` 411dp, `Tablet7` 600dp — the natural `sw >= 600dp` route, cleaner
      than a `wm density` override, `Tablet10` 800dp, `Constanza_API31`) are for that
      manual route only; Gradle Managed Devices never touches them. Physical hardware is
      required only for what an emulator cannot reproduce: the One UI
      background-throttling row (carried-forward item `G.7-throttling-row`) and a real
      fold/unfold configuration change — a phone AVD reports only the `DEFAULT` device
      state (`adb shell cmd device_state print-states`). `cmdline-tools` IS now installed
      (`$ANDROID_HOME/cmdline-tools/latest/bin/{sdkmanager,avdmanager}`), which supersedes
      the "no avdmanager binary" reason recorded against the `colour-dot-fold-unfold`
      carried-forward item; a foldable AVD is now creatable from the command line.
    device_free_matrix:
      status: ratified
      date: 2026-09-02
      by: user
      convention: >
        The standard develop / test / release cycle MUST be fully verifiable on an
        emulator with nothing plugged in. Granting the notification permission through
        the real system dialog, adding a habit, a reminder notification actually
        arriving, answering from that notification, and removing a habit are all driven
        through the product's own UI and asserted autonomously — see
        `app/src/androidTest/kotlin/com/jjrapps/constanza/e2e/CoreFlowE2ETest.kt`.
        Physical-hardware testing happens only by explicit prior agreement. Do not ask
        for a device as a matter of course, and do not record a check as unverifiable
        merely because nothing is attached.
      command: "./gradlew :app:emulatorMatrixGroupDebugAndroidTest"
      devices: >
        Two, declared in `app/build.gradle.kts` under `testOptions.managedDevices` and
        grouped as `emulatorMatrix`, so the one command above runs the whole matrix.
        `api31` (Pixel 6, SDK 31, `aosp-atd`) is the API 31-32 half of the
        `POST_NOTIFICATIONS` boundary, where the runtime permission does not exist,
        `NotificationPermission.decide` answers `NOT_APPLICABLE`, and the Today banner
        must never render. `api37` (Pixel 6, SDK 37, `google_apis`, 4KB pages) is
        targetSdk, where the permission exists and the real
        `com.android.permissioncontroller` dialog is tapped through UiAutomator. The
        API 37 leg is NOT on an ATD image because Google publishes none at that API
        level; `google_apis` is the lightest image android-37.0 offers. Gradle Managed
        Devices downloads its system images and creates its own AVDs on first run, which
        is slow once and cached afterwards.
      limits: >
        Read this before treating a green matrix as a release gate. A green matrix is
        NOT evidence about the maintainer's Galaxy S25, or about any One UI device. An
        emulator does not reproduce One UI's aggressive background-process killing, its
        "put unused apps to sleep" policy, or real Doze — and those three are exactly
        the conditions under which this app's reminders are most likely to fail in the
        field, because every one of them attacks the alarm-and-worker path the whole
        feature rests on. What the matrix proves is that the product's own logic and
        wiring are correct; it says nothing about whether the OEM will let that wiring
        run. The maintainer has accepted that residual risk knowingly. The
        carried-forward items `G.7-throttling-row` and `colour-dot-fold-unfold` stay
        exactly as open as they were.
    java_home: >
      REQUIRED for every `./gradlew` invocation — this machine has no system JDK and
      Gradle dies with "Unable to locate a Java Runtime" without it. Applies to all
      commands in this section, not only the instrumented one:
      `export JAVA_HOME="/Applications/Android Studio.app/Contents/jbr/Contents/Home"`
      (OpenJDK 21, bundled with Android Studio).
  coverage:
    available: false
    command: ""
  quality:
    linter:
      available: true
      command: "./gradlew :domain:detektMain :app:detektMain"
    formatter:
      available: false
      command: ""

  # Recorded by sdd-design (2026-08-31) for change habit-tracking-mvp. At design time this was
  # DESIGN INTENT ONLY. The `available` flags above are left untouched by sdd-apply work unit 1
  # (still scoped to :app instrumented/lint status, unverified); `strict_tdd` below WAS updated
  # by sdd-apply once `./gradlew :domain:test` was verified green in this repository — see the
  # gate condition this replaces.
  design_intent:
    frameworks:
      unit: "JUnit4 + kotlin.test (revises the earlier unratified JUnit5 plan)"
      mocking: "MockK; Turbine for Flow; kotlinx-coroutines-test"
      instrumented: "AndroidX Test + androidx.work:work-testing + compose-ui-test-junit4"
      migrations: "Room MigrationTestHelper against the checked-in app/schemas/com.jjrapps.constanza.core.data.AppDatabase/1.json"
    commands:
      domain_unit: "./gradlew :domain:test"
      app_unit: "./gradlew :app:testDebugUnitTest"
      instrumented: "./gradlew :app:connectedDebugAndroidTest"
      aggregate: "./gradlew check"
      assemble: "./gradlew assembleDebug"
    strict_tdd_gate: >
      Once ./gradlew :domain:test runs green in THIS repository, enable strict TDD
      SCOPED TO :domain — that module is pure, fast, and dependency-free, and holds
      the logic where a silent error is most expensive. Keep :app non-strict while
      its instrumented suite is still unverified. Do not flip the flag on the basis
      of this recorded intent alone.
    manual_verification_note: >
      Alarm delivery across reboot, timezone change, Doze, OEM throttling, denied
      permissions, and snooze-across-midnight is not automatable and has an adb
      recipe matrix in design.md section 13.3. It MUST be run on an API 37 image.

strict_tdd: true
strict_tdd_scope: ":domain only — :app stays non-strict (its instrumented suite is still unverified)"
strict_tdd_reason: >
  Flipped by sdd-apply (work unit 1, 2026-08-31): `./gradlew :domain:test` was verified green in
  this repository (PlaceholderTest passes; empty-suite acceptance criterion from tasks.md 1.9 is
  satisfied). This discharges the strict_tdd_gate condition recorded above by sdd-design. Strict
  TDD now applies to :domain (pure, fast, dependency-free — the highest-value place for a RED
  test to exist before the GREEN implementation, per design.md §13.2). :app remains non-strict
  until its instrumented suite (Room DAOs, workers, Compose UI tests) is verified in work unit 3+.

rules:
  proposal:
    - Include a rollback plan for any change that touches scheduling/alarms or persisted data
    - State explicitly which parts of the stack above the proposal treats as still unratified
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Keep the domain module (scheduling/scoring) framework-agnostic in requirement language
  design:
    - Confirm or revise the planned stack in this file's `stack:` section; do not assume it silently
    - Document architecture decisions with rationale, especially module boundaries
    - Include sequence diagrams for reminder/alarm and snooze flows
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
    - Sequence Gradle/module scaffolding before feature tasks that depend on it
  apply:
    guidelines:
      - Follow Clean/Hexagonal/Screaming Architecture boundaries once scaffolded
      - Keep the domain module free of Android SDK imports
    tdd: true # :domain scope only — see strict_tdd_reason above
    test_command: "./gradlew :domain:test"
  verify:
    test_command: "./gradlew check"
    build_command: "./gradlew assembleDebug"
    device_free_matrix_command: "./gradlew :app:emulatorMatrixGroupDebugAndroidTest"
    device_free_matrix_note: >
      `check` covers unit tests, lint and detekt only — it runs no instrumented test at
      all, so a green `check` says nothing about the reminder path. Run the matrix
      command above for that, and read `testing.instrumented.device_free_matrix.limits`
      before quoting the result as release evidence.
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Update this file's `stack:` and `testing:` status from planned to verified once confirmed
